<style>
:root {
  --bg-1: #fff4dc;
  --bg-2: #ffe1d0;
  --ink: #2a3a4d;
  --ice-deep: #3d7896;
  --ice-mid: #b8dce8;
  --ice-light: #f0faff;
  --machine: #fafafa;
  --machine-shadow: #d8d4c4;
  --accent: #e94560;
  --bamboo: #8b5e3c;
  --bamboo-light: #c89668;
  --gold: #d4a44a;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { overscroll-behavior: none; }

body {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-weight: 500;
  background:
    radial-gradient(ellipse at 85% 10%, #fff8d4 0%, transparent 45%),
    radial-gradient(ellipse at 10% 90%, #ffd9e8 0%, transparent 50%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: var(--ink);
  padding: 18px 14px 30px;
  position: relative;
  overflow-x: hidden;
}

/* paper texture overlay */
body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none;
  background-image:
    repeating-linear-gradient(45deg, transparent 0 60px, rgba(255,255,255,0.25) 60px 61px),
    repeating-linear-gradient(-45deg, transparent 0 60px, rgba(184,220,232,0.18) 60px 61px);
  z-index: 0;
}

/* floating snowflakes */
.flake {
  position: fixed;
  color: rgba(95, 168, 196, 0.35);
  pointer-events: none;
  font-size: 16px;
  z-index: 0;
  animation: drift 14s linear infinite;
}
@keyframes drift {
  0% { transform: translateY(-30px) rotate(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

.title-wrap {
  text-align: center;
  z-index: 1;
  position: relative;
  margin-bottom: 6px;
}

h1 {
  font-family: 'Yusei Magic', serif;
  font-size: clamp(30px, 6.5vw, 46px);
  color: var(--ice-deep);
  letter-spacing: 0.04em;
  line-height: 1;
  text-shadow:
    3px 3px 0 #fff,
    6px 6px 0 rgba(95,168,196,0.25);
  transform: rotate(-1.5deg);
  display: inline-block;
}

h1 .accent { color: var(--accent); }

.subtitle {
  font-family: 'DotGothic16', monospace;
  font-size: 11px;
  color: var(--ice-deep);
  opacity: 0.75;
  margin-top: 10px;
  letter-spacing: 0.25em;
  z-index: 1;
}

.game-wrap {
  position: relative;
  width: min(100%, 460px);
  z-index: 1;
  margin-top: 14px;
}

.scoreboard {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  background: #fff;
  border: 3px solid var(--ink);
  border-radius: 18px;
  padding: 10px 4px;
  margin-bottom: 12px;
  box-shadow: 4px 4px 0 var(--ink);
  position: relative;
}

.score-item {
  text-align: center;
  position: relative;
}

.score-item + .score-item::before {
  content: '';
  position: absolute;
  left: 0; top: 15%;
  height: 70%;
  width: 2px;
  background: var(--ink);
  opacity: 0.15;
}

.score-label {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--ink);
  opacity: 0.65;
  margin-bottom: 3px;
}

.score-value {
  font-family: 'Yusei Magic', serif;
  font-size: 22px;
  color: var(--ice-deep);
  line-height: 1;
}

.score-value .unit {
  font-size: 11px;
  margin-left: 1px;
  opacity: 0.7;
}

.score-item.best .score-value { color: var(--accent); }
.score-item.best.recording {
  animation: best-flash 0.6s ease-out 4;
}
@keyframes best-flash {
  0%   { box-shadow: 0 0 0 0 rgba(255,206,74,0.7); }
  50%  { box-shadow: 0 0 0 14px rgba(255,206,74,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,206,74,0); }
}

.best-stack {
  font-family: 'Yusei Magic', serif;
  color: var(--accent);
  line-height: 1.15;
}
.best-stack .best-row {
  font-size: 15px;
  white-space: nowrap;
}
.best-stack .best-row.score {
  font-weight: 900;
  font-size: 17px;
}
.best-stack .unit {
  font-size: 9px;
  margin-left: 1px;
  opacity: 0.7;
}

.score-item.time .score-value { color: #2a3a4d; }
.score-item.time.urgent .score-value {
  color: var(--accent);
  animation: pulse-urgent 0.45s ease-in-out infinite alternate;
  text-shadow: 0 0 6px rgba(255,94,122,0.6);
}
.score-item.time.urgent {
  animation: time-shake 0.45s ease-in-out infinite alternate;
}
.score-item.time.done .score-value {
  color: var(--accent);
  opacity: 0.55;
}
@keyframes pulse {
  from { transform: scale(1); }
  to   { transform: scale(1.12); }
}
@keyframes pulse-urgent {
  from { transform: scale(1);    color: var(--accent); }
  to   { transform: scale(1.20); color: #ff2a5a; }
}
@keyframes time-shake {
  from { transform: translateX(-1px); }
  to   { transform: translateX(1px); }
}

/* Best record progress bars — show how close current is to the personal best */
.best-bar {
  width: 100%;
  height: 3px;
  background: rgba(42,58,77,0.15);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 2px;
}
.best-bar .best-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #ffd84a, #ff5e7a);
  border-radius: 2px;
  width: 0%;
  transition: width 0.3s ease-out;
}
.best-bar .best-bar-fill.maxed {
  background: linear-gradient(90deg, #ffd84a, #6cba87, #4287d6, #ff5e7a);
  animation: rainbow-shift 1.6s linear infinite;
  background-size: 200% 100%;
}
@keyframes rainbow-shift {
  from { background-position: 0% 50%; }
  to   { background-position: 200% 50%; }
}

.score-item.flash .score-value {
  animation: rot-flash 0.45s ease-out;
}
@keyframes rot-flash {
  0%   { transform: scale(1);   color: var(--ice-deep); }
  30%  { transform: scale(1.32); color: #ff9d3d; }
  100% { transform: scale(1);   color: var(--ice-deep); }
}

canvas {
  display: block;
  width: 100%;
  height: 560px;
  border: 3px solid var(--ink);
  border-radius: 20px;
  background:
    linear-gradient(180deg,
      #d8ecf5 0%,
      #f3e9d4 65%,
      #e6d4b6 100%);
  box-shadow: 4px 4px 0 var(--ink);
  touch-action: none;
  cursor: grab;
}
canvas.dragging { cursor: grabbing; }
canvas.eating { cursor: pointer; }

button {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-weight: 700;
  padding: 9px 16px;
  border: 2.5px solid var(--ink);
  border-radius: 25px;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
  letter-spacing: 0.05em;
  box-shadow: 3px 3px 0 var(--ink);
  transition: transform 0.08s, box-shadow 0.08s;
  font-size: 13px;
}
button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

button.syrup { color: #fff; }
button.s-ichigo { background: #e94560; }
button.s-melon  { background: #6cba87; }
button.s-blue   { background: #4287d6; }
button.s-lemon  { background: #f2c94c; color: var(--ink); }

button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  filter: grayscale(0.5);
  box-shadow: 2px 2px 0 var(--ink);
}
button:disabled:hover { transform: none; box-shadow: 2px 2px 0 var(--ink); }

button.syrup.selected {
  transform: translate(1px, 1px);
  box-shadow: 2px 2px 0 var(--ink), 0 0 0 3px #fff, 0 0 0 5px var(--ink);
}
button.syrup.selected:hover { transform: translate(0, 0); }

.reset-btn.big {
  background: #ffce4a;
  color: #2a3a4d;
  font-weight: 900;
  font-size: 16px;
  padding: 12px 26px;
  letter-spacing: 0.08em;
  animation: confirm-pulse 1.4s ease-in-out infinite;
}

/* reward mode の「できた！」ボタン — playing 中に表示、 finished へ移行する */
.done-btn {
  background: #80ed99;
  color: #2a3a4d;
  font-weight: 900;
  font-size: 16px;
  padding: 12px 26px;
  letter-spacing: 0.08em;
  animation: confirm-pulse 1.4s ease-in-out infinite;
}

/* 音声 ON/OFF トグル — 右上に固定、 設定階層 (= Primary でも Safety-net でもない) */
.mute-btn {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 20;
  width: 44px;
  height: 44px;
  background: rgba(255, 255, 255, 0.92);
  border: 2.5px solid var(--ink);
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--ink);
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.mute-btn:hover { background: #fff; }
.mute-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }

/* Safety-net ゾーン — ホーム専用、 画面左下に常時固定。 主役 pill と物理的に離す。
   Codex 案: 「Primary と Safety-net を同一 pill に混ぜない」 隣接禁止ルール。 */
.safety-controls {
  position: absolute;
  left: 14px;
  bottom: 14px;
  z-index: 7;
}
.safety-controls.hidden { display: none; }

/* ホームボタン — Safety-net 階層、 白/低彩度、 主役より目立たない。 44×44 以上の tap target */
.home-btn {
  background: #fff;
  color: #2a3a4d;
  font-weight: 700;
  font-size: 13px;
  padding: 10px 16px;
  letter-spacing: 0.04em;
  min-width: 88px;
  min-height: 44px;
}
.home-btn:hover { background: #fff; transform: translate(-1px, -1px); }

/* Share ゾーン — reveal phase 限定、 右下固定 (= ホームと対称) */
.share-controls {
  position: absolute;
  right: 14px;
  bottom: 14px;
  z-index: 7;
}
.share-controls.hidden { display: none; }

.share-btn {
  background: #fff5e0;
  color: var(--ink);
  font-weight: 900;
  font-size: 13px;
  padding: 10px 16px;
  letter-spacing: 0.04em;
  border-radius: 22px;
  border: 2.5px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  min-width: 88px;
  min-height: 44px;
  cursor: pointer;
  font-family: 'Zen Maru Gothic', sans-serif;
}
.share-btn:hover { background: #ffeebd; transform: translate(-1px, -1px); }
.share-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
/* During the brief lockout after eating, the button is greyed and doesn't
   pulse — so an in-flight click can't accidentally trigger a retry. */
.reset-btn.big.locked {
  background: #d8d3c2;
  color: #8a8676;
  cursor: not-allowed;
  animation: none;
  box-shadow: 3px 3px 0 #2a3a4d;
}
@keyframes confirm-pulse {
  0%, 100% {
    transform: translate(0, 0);
    box-shadow: 3px 3px 0 var(--ink), 0 0 0 0 rgba(255,206,74,0.55);
  }
  50% {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--ink), 0 0 0 8px rgba(255,206,74,0.0);
  }
}

.hint {
  font-family: 'DotGothic16', monospace;
  font-size: 11px;
  text-align: center;
  margin-top: 12px;
  color: var(--ink);
  opacity: 0.6;
  letter-spacing: 0.15em;
}

.canvas-wrap {
  position: relative;
}

.action-controls {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  justify-content: center;
  background: rgba(255, 250, 235, 0.95);
  border: 3px solid var(--ink);
  border-radius: 32px;
  padding: 8px 14px;
  box-shadow: 4px 4px 0 var(--ink);
  z-index: 6;
  max-width: 92%;
  backdrop-filter: blur(4px);
}
.action-controls.hidden { display: none; }
.action-controls.center {
  bottom: auto;
  top: 50%;
  transform: translate(-50%, -50%);
}
/* Hide temporarily so the next-step UI feels like a fresh appearance */
.action-controls.hide-temp {
  opacity: 0;
  pointer-events: none;
  visibility: hidden;
}
/* Bouncy entrance to grab attention when 食べる becomes available */
.action-controls.reveal {
  animation: pill-reveal 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.action-controls.center.reveal {
  animation: pill-reveal-center 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes pill-reveal {
  0%   { opacity: 0; transform: translateX(-50%) translateY(50px) scale(0.55); }
  100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}
@keyframes pill-reveal-center {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.45); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.celebrate {
  position: absolute;
  top: 38%;
  left: 0;
  right: 0;
  text-align: center;
  font-family: 'Yusei Magic', serif;
  font-size: 42px;
  font-weight: 900;
  color: var(--accent);
  padding: 14px;
  pointer-events: none;
  opacity: 0;
  z-index: 10;
  letter-spacing: 0.04em;
  text-shadow:
    3px 3px 0 #fff, -3px 3px 0 #fff, 3px -3px 0 #fff, -3px -3px 0 #fff,
    0 3px 0 #fff, 3px 0 0 #fff, 0 -3px 0 #fff, -3px 0 0 #fff,
    6px 6px 0 rgba(42,58,77,0.40),
    0 0 20px rgba(255,206,74,0.8);
}
.celebrate.show { animation: pop 1.8s cubic-bezier(.34,1.56,.64,1); }
/* small バリアント: reward モードの「シロップを えらんでね」 のように
   pill と重なる場面で大きすぎないように縮小 + 上寄せ */
.celebrate.small { font-size: 28px; top: 24%; }
@keyframes pop {
  0%   { opacity: 0; transform: scale(0.3) translateY(-30px) rotate(-8deg); }
  15%  { opacity: 1; transform: scale(1.25) translateY(0) rotate(2deg); }
  25%  { transform: scale(0.92) rotate(-2deg); }
  35%  { transform: scale(1.05) rotate(1deg); }
  45%  { transform: scale(1) rotate(0); }
  80%  { opacity: 1; }
  100% { opacity: 0; transform: scale(1.05) translateY(-15px); }
}

@media (max-width: 420px) {
  canvas { height: 500px; }
  .score-value { font-size: 17px; }
  .score-label { font-size: 9px; letter-spacing: 0.1em; }
  .score-value .unit { font-size: 10px; }
  .best-stack .best-row { font-size: 13px; }
  .best-stack .best-row.score { font-size: 15px; }
  .best-stack .unit { font-size: 8px; }
  button { padding: 8px 12px; font-size: 12px; }
}

/* ---------- mode-select overlay ---------- */
/* Sits on top of the canvas inside .canvas-wrap. Big tap targets for kids. */
.mode-select {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  border-radius: 20px;
  background:
    radial-gradient(ellipse at 50% 0%, #fff6d9 0%, transparent 60%),
    linear-gradient(180deg, rgba(255,248,232,0.94), rgba(255,235,210,0.94));
  backdrop-filter: blur(4px);
  z-index: 11;
  padding: 28px 18px;
}
.mode-select.hidden { display: none; }

.ms-title {
  font-family: 'Yusei Magic', serif;
  font-size: clamp(22px, 5.5vw, 28px);
  color: var(--ice-deep);
  text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(95,168,196,0.25);
  letter-spacing: 0.04em;
  text-align: center;
  margin: 0;
}

.ms-subtitle {
  font-family: 'Yusei Magic', serif;
  font-size: clamp(18px, 4.5vw, 22px);
  color: var(--ice-deep);
  text-shadow: 1px 1px 0 #fff;
  letter-spacing: 0.04em;
  text-align: center;
  margin: 0;
  opacity: 0.85;
}

/* 屋台タイル段 (= ハイブリッド型ホームメニューの上段) */
.ms-stalls {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.ms-stall {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-weight: 900;
  width: clamp(90px, 24vw, 110px);
  min-height: 100px;
  padding: 8px 6px;
  border: 3px solid var(--ink);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  letter-spacing: 0.04em;
  background: #fff5e0;
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s;
}
.ms-stall:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.ms-stall:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

.ms-stall.ms-stall-active,
.ms-stall.selected {
  background: #ffe1a8;
  /* 「いま選ばれてる」 = 強調枠 + glow */
  box-shadow: 3px 3px 0 var(--ink), 0 0 0 3px #ffce4a;
}

.ms-stall.ms-stall-coming {
  background: #ecebe5;
  color: #8e8b81;
  opacity: 0.65;
  cursor: not-allowed;
  border-style: dashed;
  border-color: #b7b3a6;
  box-shadow: none;
}
.ms-stall.ms-stall-coming:hover { transform: none; box-shadow: none; }

.ms-stall-emoji {
  font-size: 30px;
  line-height: 1;
}
.ms-stall-label {
  font-size: 14px;
  font-weight: 900;
}
.ms-stall-sub {
  font-family: 'DotGothic16', monospace;
  font-size: 10px;
  opacity: 0.7;
}

.title-key {
  width: clamp(180px, 60vw, 280px);
  max-height: 200px;
  object-fit: contain;
  display: block;
  pointer-events: none;
  filter: drop-shadow(3px 4px 0 rgba(95,168,196,0.25));
}

.ms-buttons {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center;
}

.ms-btn {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-weight: 900;
  width: clamp(140px, 38vw, 170px);
  min-height: 170px;
  padding: 18px 12px;
  border: 4px solid var(--ink);
  border-radius: 22px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--ink);
  box-shadow: 5px 5px 0 var(--ink);
  transition: transform 0.08s, box-shadow 0.08s;
  letter-spacing: 0.04em;
}
.ms-btn:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
.ms-btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }

.ms-btn .ms-emoji {
  font-size: 44px;

<body>

<div class="title-wrap">

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  const rect = canvas.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(rect.width * DPR);
  canvas.height = Math.round(rect.height * DPR);
  W = rect.width;
  H = rect.height;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // canvas-relative entities need recomputing on size change
  initBgAnimals();
  initLanterns();
  initClouds();
}

// ---------- state ----------
const GAME_DURATION = 30; // seconds

const state = {
  shavings: 0,
  rotations: 0,
  totalRad: 0,            // total absolute radians turned
  handleAngle: 0,         // current visual rotation of handle/crank
  lastPointerAngle: null,
  isDragging: false,
  particles: [],          // ice particles flying out of machine
  syrupDrops: [],         // bouncing splash droplets (visual flair during pour)
  syrupCoating: null,     // { color, drips:[], progress, durationFrames }
  pileH: 0,               // current pile height in pixels (world units)
  pileR: 0,               // current pile radius
  // M9.1: 「自分のかき氷」 演出 — 形タイプ + 手作りでこぼこ
  pileShape: 'mokomoko',  // 'fluffy' (ゆっくり回し) | 'mokomoko' (普通) | 'tsuntsun' (速回)
  pileProfile: null,      // finishGame で固定する [{nx, bump}] (= 左右非対称な小ふくらみ)
  playingStartT: 0,       // playing 開始時刻 (= cps 計算用)
  // M12.5: わたあめ「ふわふわ風あつめ」 専用
  cottonParticles: [],    // 漂う綿粒 [{x, y, vx, vy, size, side}]
  cottonSpawnT: 0,        // 粒生成タイマー
  cottonStrokeTotal: 0,   // 累計 stroke 距離 (= 形タイプ判定)
  cottonLastPointer: null,// pointerMove 前フレームの位置
  cottonBalance: 0,       // -1 (左寄り) ↔ +1 (右寄り) 偏り
  best: 0,
  newRecord: false,
  heightNewRecord: false,
  scoreNewRecord: false,
  fluff: [],              // visual fluff bumps on the pile surface
  shakeT: 0,
  cameraScale: 1,
  lastSpawnTime: 0,
  // timer
  phase: 'title',         // 'title' | 'mode-select' | 'ready' | 'playing' | 'finished' | 'reveal' | 'eating' | 'done'
  activity: 'kakigori',   // M11: 屋台種別 ('kakigori' | future: 'cottoncandy' | 'kingyo' | ...)
  mode: null,             // 'reward' | 'challenge' — set after the player picks on mode-select.
                          // M1.2: both modes share the same behaviour; M1.3 splits reward mode.
  revealT: 0,             // reveal phase の経過秒 (= reward 専用、 2.5s で auto done)
  timeLeft: GAME_DURATION,
  titleT: 0,              // animation timer for opening screen
  bgAnimals: [],          // animals scurrying around in the background
  // 🐧 animal reactions
  animalExcitement: 0,    // 0..1 — drives bgAnimal hop frequency/height
  syncJumpT: 0,           // > 0 → all animals jump together (cheer event)
  // ✨ pile sparkles
  pileSparkles: [],       // [{x, y, size, life, max}]
  // ⏰ last-5-second tension + TIME UP slow-mo flash
  timeUpFlashT: 0,        // > 0 → big white-flash + slight slow-mo
  warningPulseT: 0,       // accumulates during last 5s for screen pulse
  // 🔥 eating combo
  comboCount: 0,
  comboLastT: 0,
  comboBest: 0,
  comboCelebrateT: 0,     // > 0 → big "COMBO ×N" text on screen
  comboCelebrateN: 0,     // which combo milestone to display
  // 🏮 festival decorations
  lanterns: [],           // [{x, y, color, phase}]
  confettiBg: [],         // [{x, y, vx, vy, rot, vrot, color, size}]
  // ☁️ drifting clouds
  clouds: [],             // [{x, y, size, speed}]
  // 🎓 first-time hint
  readyHintT: 0,          // seconds in ready phase (used to fade out hint)
  // 🎆 fireworks for new records
  fireworks: [],          // [{x,y,age,max,color,pieces}]
  recordFlashT: 0,        // > 0 → full-screen rainbow flash
  // eating
  eatingClicks: 0,
  eatingMaxClicks: 15,
  eatingStartT: 0,
  eatingElapsed: 0,
  eatingLiveMult: 1,
  frozenHeightCm: 0,
  frozenPileH: 0,
  frozenPileR: 0,
  targetPileH: 0,
  targetPileR: 0,
  finalMultiplier: 1,
  finalScore: 0,
  bestScore: 0,
  bestHeight: 0,
  multBadgePulse: 0,
  chompFx: [],            // [{x,y,life,word}] - bite hit indicators
  rotationFx: [],         // [{life}] - rotation bonus indicator near machine
  transitionT: 0,         // seconds remaining of step-change transition
  // celebration
  celebrating: false,
  celebrationT: 0,        // seconds since celebration began
  celebrationZoom: 1,     // multiplier on camera scale during reveal
  characters: [],         // {type, baseX, baseY, entryT, bobPhase}
  sparkles: [],           // {x, y, phase, size}
  praiseLabel: '',
};

// ---------- best score persistence ----------
// In a Claude Artifact sandbox, window.storage is provided. In any other
// environment (Claude Code, local file, normal hosting) it doesn't exist —
// fall back to localStorage so the file is fully portable.
const _hasArtifactStorage = typeof window !== 'undefined'
  && window.storage
  && typeof window.storage.get === 'function';

async function _readKey(key) {
  if (_hasArtifactStorage) {
    try {
      const r = await window.storage.get(key);
      return (r && r.value) ? r.value : null;
    } catch(e) { return null; }
  }
  try { return localStorage.getItem(key); } catch(e) { return null; }
}
async function _writeKey(key, val) {
  if (_hasArtifactStorage) {
    try { await window.storage.set(key, String(val)); } catch(e) {}
    return;
  }
  try { localStorage.setItem(key, String(val)); } catch(e) {}
}

async function loadBest() {
  const sScore  = await _readKey('kakigori-best-score');
  const sHeight = await _readKey('kakigori-best-height');
  if (sScore)  state.bestScore  = parseFloat(sScore)  || 0;
  if (sHeight) state.bestHeight = parseFloat(sHeight) || 0;
  updateScoreUI();
}
async function saveBestScore(val)  { await _writeKey('kakigori-best-score',  val); }
async function saveBestHeight(val) { await _writeKey('kakigori-best-height', val); }
loadBest();

// ---------- helpers ----------
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- sprite preload ----------
// procedural コードを sprite に置き換え。 sprite 不在時はその要素だけ描画 skip
// (画像 load 完了まで数 ms の broken 表示を避けるため complete check で gate)。
// user が assets/images/sprites/ 内の同名 PNG を生成画像で上書きすれば即反映。
const sprites = {
  penguin:   Object.assign(new Image(), { src: 'assets/images/sprites/char-penguin.png' }),
  shirokuma: Object.assign(new Image(), { src: 'assets/images/sprites/char-shirokuma.png' }),
  chick:     Object.assign(new Image(), { src: 'assets/images/sprites/char-chick.png' }),
  machine:   Object.assign(new Image(), { src: 'assets/images/sprites/machine-body.png' }),
  bowl:      Object.assign(new Image(), { src: 'assets/images/sprites/bowl.png' }),
};
const spriteReady = (sp) => sp && sp.complete && sp.naturalWidth > 0;

// ---------- audio (= Web Audio API procedural SE) ----------
// 外部 wav を持たず、 AudioContext で都度 oscillator/buffer を生成する方針。
// iOS Safari 対策: 最初の user gesture で resume() する。
// localStorage 'natsu-mute' で ON/OFF を永続化。
let audioCtx = null;
let muted = (() => { try { return localStorage.getItem('natsu-mute') === '1'; } catch (_) { return false; } })();
let lastSliceT = 0;

function getAudio() {
  if (!audioCtx) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    audioCtx = new Ctor();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function envBeep(ctx, freq, dur, peak, type, freqEnd) {
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = type || 'triangle';
  osc.frequency.setValueAtTime(freq, now);
  if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, now + dur);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(peak, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + dur + 0.02);
}
// ハンドル回転中の「シャリシャリ」 (= 短い高音ノイズ burst、 throttle 必須)
function sndSlice() {
  if (muted) return;
  const ctx = getAudio(); if (!ctx) return;
  const t = performance.now();
  if (t - lastSliceT < 80) return;
  lastSliceT = t;
  const now = ctx.currentTime;
  const dur = 0.07;
  const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const filt = ctx.createBiquadFilter(); filt.type = 'highpass'; filt.frequency.value = 3500;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.18, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.connect(filt).connect(gain).connect(ctx.destination);
  src.start(now); src.stop(now + dur);
}
// 1 回転ボーナスの「キラン」
function sndRotationBonus() {
  if (muted) return;
  const ctx = getAudio(); if (!ctx) return;
  envBeep(ctx, 1320, 0.16, 0.12, 'triangle', 2640);
}
// シロップ pour 「とろっと」
function sndSyrup() {
  if (muted) return;
  const ctx = getAudio(); if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.linearRampToValueAtTime(420, now + 0.4);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.18, now + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.44);
}
// 連打「ガブッ」
function sndChomp() {
  if (muted) return;
  const ctx = getAudio(); if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(160, now);
  osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.20, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.10);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.12);
}
// 完成 (= reward モード「できたね！」) C E G C メロディ
function sndFinish() {
  if (muted) return;
  const ctx = getAudio(); if (!ctx) return;
  const notes = [523.25, 659.25, 783.99, 1046.5];
  const now = ctx.currentTime;
  notes.forEach((f, i) => {
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = f;
    const gain = ctx.createGain();
    const t = now + i * 0.10;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.18, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.28);
  });
}
// TIME UP (= challenge モードのタイマー切れ) 下降 E C G
function sndTimeUp() {
  if (muted) return;
  const ctx = getAudio(); if (!ctx) return;
  const notes = [659.25, 523.25, 392.00];
  const now = ctx.currentTime;
  notes.forEach((f, i) => {
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = f;
    const gain = ctx.createGain();
    const t = now + i * 0.13;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.15, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.32);
  });
}
// 新記録 C E G C E G (= 上昇 ファンファーレ)
function sndNewRecord() {
  if (muted) return;
  const ctx = getAudio(); if (!ctx) return;
  const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
  const now = ctx.currentTime;
  notes.forEach((f, i) => {
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = f;
    const gain = ctx.createGain();
    const t = now + i * 0.08;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.22, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.36);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.38);
  });
}
// モード選択ボタン「ぷり」
function sndButton() {
  if (muted) return;
  const ctx = getAudio(); if (!ctx) return;
  envBeep(ctx, 880, 0.10, 0.18, 'sine', 1320);
}
// ホームボタン (= 控えめ)
function sndHome() {
  if (muted) return;
  const ctx = getAudio(); if (!ctx) return;
  envBeep(ctx, 660, 0.10, 0.12, 'sine', 440);
}

// ミュートトグル
const btnMute = document.getElementById('btn-mute');
function refreshMuteUI() { btnMute.textContent = muted ? '🔇' : '🔊'; }
btnMute.addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('natsu-mute', muted ? '1' : '0'); } catch (_) {}
  refreshMuteUI();
  if (!muted) sndButton();  // 解除時に音テスト
});
refreshMuteUI();

function getPointer(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {
    x: t.clientX - rect.left,
    y: t.clientY - rect.top
  };
}

// ---------- machine geometry ----------
// Returns positions of machine, handle pivot/tip, outlet, bowl
// Everything is in screen-canvas units, accounting for camera scale.
function geometry() {
  // reveal phase: 完成かき氷を主役にする展示モード。
  // 機械系座標は画面外、 器を canvas 中央へ大きく持ち上げる (= M7.2)。
  if (state.phase === 'reveal') {
    const scale = 1.3;
    const cx = W * 0.5;
    const bowlBottomY = H * 0.68;
    const bowlRimY = bowlBottomY - 35 * scale;
    state.cameraScale = scale;
    return {
      bowlBottomY, bowlRimY, bowlCenterX: cx, bowlW: Math.min(W * 0.7, 280) * scale,
      machineTopY: -1000, machineBottomY: -1000, machineCenterX: cx, machineHeight: 0,
      handlePivotX: -1000, handlePivotY: -1000, armLen: 0,
      pileTopY: bowlRimY - state.pileH * scale,
      scale,
    };
  }
  // World units: bowl height 35, machine height 180, gap 30, all scaled uniformly.
  const bowlBottomY = H - 40;
  const bowlCenterX = W * 0.45;
  const baseBowlW = Math.min(W * 0.7, 280);
  const baseBowlH = 35;
  const machineHeight = 180;
  const gap = 30;

  // Camera: total world height (bowl + pile + gap + machine) must fit between
  // bowlBottomY and minTop. Compute uniform scale once and apply to everything.
  const minTop = 12;
  const availH = bowlBottomY - minTop;
  const worldH = baseBowlH + state.pileH + gap + machineHeight;
  let scale = Math.min(1, availH / worldH);
  scale = clamp(scale, 0.18, 1);

  // During celebration, animate an extra pull-back to frame the whole scene
  if (state.celebrating) {
    // celebrationZoom eases from 1.0 down toward 0.72 over ~0.7s
    state.celebrationZoom += (0.72 - state.celebrationZoom) * 0.06;
  } else if (state.celebrationZoom < 0.999) {
    state.celebrationZoom += (1.0 - state.celebrationZoom) * 0.12;
  }
  scale *= state.celebrationZoom;
  state.cameraScale = scale;

  // Apply scale uniformly — bowl, pile, gap, machine all shrink together
  const bowlW = baseBowlW * scale;
  const bowlRimY = bowlBottomY - baseBowlH * scale;
  const pileTopY = bowlRimY - state.pileH * scale;
  const machineBottomY = pileTopY - gap * scale;
  const machineTopY = machineBottomY - machineHeight * scale;
  const machineCenterX = bowlCenterX;

  // handle: arm extends from right side of machine
  const handlePivotX = machineCenterX + 65 * scale;
  const handlePivotY = machineBottomY - 80 * scale;
  const armLen = 38 * scale;

  return {
    bowlBottomY, bowlRimY, bowlCenterX, bowlW,
    machineTopY, machineBottomY, machineCenterX, machineHeight: machineHeight * scale,
    handlePivotX, handlePivotY, armLen,
    pileTopY,
    scale
  };
}

// ---------- pile shape (= 自分のかき氷 / M9.1) ----------
// 形タイプ別の dome パラメータ。 「失敗形なし」: どれも肯定的な個性として描く。
const PILE_SHAPES = {
  fluffy:   { power: 0.85, rMul: 1.12, hMul: 0.88, name: 'ふわふわ', cloudName: 'ふわふわ' },
  mokomoko: { power: 1.30, rMul: 1.00, hMul: 1.00, name: 'もこもこ', cloudName: 'まんまる' },
  tsuntsun: { power: 2.20, rMul: 0.85, hMul: 1.10, name: 'つんつん', cloudName: 'もりもり' },
};
function getPileShape() {
  const sh = PILE_SHAPES[state.pileShape] || PILE_SHAPES.mokomoko;
  // 屋台ごとに形タイプ名を切り替え (= わたあめでは「つんつん」 は不自然なので別 alias)
  const isCloud = state.activity === 'cottoncandy';
  return { ...sh, name: isCloud ? sh.cloudName : sh.name };
}
function getActivityName() {
  return { kakigori: 'かき氷', cottoncandy: 'わたあめ' }[state.activity] || 'かき氷';
}
// nx ∈ [-1, 1] における山表面の高さ。 h は基準スケール後の値を渡す。
function pileSurfaceHeight(nx, h) {
  const sh = getPileShape();
  let dome = h * Math.pow(Math.cos(nx * Math.PI / 2), sh.power);
  if (state.pileProfile) {
    for (const f of state.pileProfile) {
      const t = (nx - f.nx) / f.width;
      if (Math.abs(t) >= 1) continue;
      dome += h * f.depth * Math.pow(Math.cos(t * Math.PI / 2), 2);
    }
  }
  return dome;
}

// ---------- spawn ice ----------
function spawnShavings(amount, fromAngle) {
  const g = geometry();
  const outletX = g.machineCenterX;
  const outletY = g.machineBottomY - 4 * g.scale;
  for (let i = 0; i < amount; i++) {
    const angle = rand(-0.4, 0.4) + Math.PI / 2; // mostly downward
    const speed = rand(1.2, 2.4);
    state.particles.push({
      x: outletX + rand(-14, 14) * g.scale,
      y: outletY,
      vx: Math.cos(angle) * speed * rand(-0.6, 0.6),
      vy: Math.sin(angle) * speed,
      size: rand(2.5, 5),
      rot: rand(0, TAU),
      vrot: rand(-0.3, 0.3),
      tilt: rand(0.6, 1.4),
      life: 0,
    });
  }
}

// ---------- pile shape ----------
// taller-and-narrower growth so the pile reads as "mountain"
// (sqrt height, cube-root-ish width)
function updatePile() {
  const s = state.shavings;
  state.pileH = Math.sqrt(s) * 6.5;
  state.pileR = Math.pow(s, 0.30) * 8 + 30;
}

// ---------- particles update ----------
function updateParticles(dt) {
  const g = geometry();
  const survivors = [];
  for (const p of state.particles) {
    p.vy += 0.18 * dt;       // gravity
    p.vx *= 0.995;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vrot * dt;
    p.life += dt;

    // bite particles fly off — no landing test, just expire
    if (p.isBite) {
      if (p.life > 70 || p.y > H + 60 || p.y < -60 || p.x < -60 || p.x > W + 60) continue;
      survivors.push(p);
      continue;
    }

    // landing test: if reaches the pile profile, settle (cranking phase)
    const shLanding = getPileShape();
    const dx = (p.x - g.bowlCenterX);
    const r = state.pileR * shLanding.rMul * g.scale;
    let surfaceY = g.bowlRimY;
    if (r > 1 && Math.abs(dx) < r) {
      const nx = dx / r;
      const domeH = state.pileH * shLanding.hMul * g.scale;
      surfaceY = g.bowlRimY - pileSurfaceHeight(nx, domeH);
    }

    if (p.y >= surfaceY - 1) {
      // only accumulate during the playing phase
      const bowlReach = g.bowlW * 0.5 + 30 * g.scale;
      if (state.phase === 'playing' && Math.abs(dx) < bowlReach) {
        state.shavings += 1;
        updatePile();
        addFluff(p.x, p.y);
      }
      continue;
    }
    if (p.life > 360 || p.y > H + 50) continue;
    survivors.push(p);
  }
  state.particles = survivors;

  // syrup coating reveal animation
  if (state.syrupCoating && state.syrupCoating.progress < 1) {
    state.syrupCoating.progress = Math.min(
      1,
      state.syrupCoating.progress + dt / state.syrupCoating.durationFrames
    );
  }

  // eating phase: lerp pile down toward target size & tick live elapsed
  if (state.phase === 'eating' || state.phase === 'done') {
    state.pileH += (state.targetPileH - state.pileH) * 0.22;
    state.pileR += (state.targetPileR - state.pileR) * 0.22;
    if (state.pileH < 0.5) state.pileH = 0;
    if (state.pileR < 0.5) state.pileR = 0;
    // live elapsed counter while still chewing
    if (state.phase === 'eating' && state.eatingStartT > 0) {
      state.eatingElapsed = (performance.now() - state.eatingStartT) / 1000;
      // live multiplier preview
      const cps = state.eatingClicks / Math.max(0.2, state.eatingElapsed);
      state.eatingLiveMult = clamp(0.7 + cps * 0.3, 1.0, 5.0);
    }
  }
  // multiplier badge pulse decay
  if (state.multBadgePulse > 0) state.multBadgePulse = Math.max(0, state.multBadgePulse - 0.07 * dt);
  // chomp FX age + cleanup
  if (state.chompFx.length) {
    for (const fx of state.chompFx) fx.life += dt;
    state.chompFx = state.chompFx.filter(fx => fx.life < 32);
  }
  // rotation bonus FX
  if (state.rotationFx.length) {
    for (const fx of state.rotationFx) fx.life += dt;
    state.rotationFx = state.rotationFx.filter(fx => fx.life < 36);
  }
}

function spawnRotationBonusFx() {
  if (state.rotationFx.length > 3) state.rotationFx.shift();
  state.rotationFx.push({ life: 0 });
}

function addFluff(x, y) {
  // limit count
  if (state.fluff.length > 220) state.fluff.shift();
  state.fluff.push({
    x, y,
    r: rand(4, 9),
    a: rand(0.4, 0.85),
    born: performance.now(),
    settled: false,
  });
  // 💨 occasional dust puff sparkle on landing (frosty splash)
  if (Math.random() < 0.18) {
    state.pileSparkles.push({
      x: x + rand(-3, 3),
      y: y + rand(-3, 0),
      size: rand(3, 5.5),
      life: 0,
      max: rand(18, 28),
      color: '#ffffff',
    });
  }
}

// ---------- drawing ----------
function drawBowl(g) {
  if (!spriteReady(sprites.bowl)) return;
  // sprite was exported with bowlW=280, scale=1, sprite size 360×120,
  // bowl 足元 at sprite_h - 12 = 108. → scale で uniform 縮拡。
  const { bowlCenterX, bowlBottomY, scale } = g;
  const drawW = 360 * scale;
  const drawH = 120 * scale;
  ctx.drawImage(
    sprites.bowl,
    bowlCenterX - drawW / 2,
    bowlBottomY - 108 * scale,
    drawW,
    drawH
  );
}

function drawPile(g) {
  if (state.pileH < 1) return;
  const sh = getPileShape();
  const r = state.pileR * sh.rMul * g.scale;
  const h = state.pileH * sh.hMul * g.scale;
  const cx = g.bowlCenterX;
  const baseY = g.bowlRimY;

  // pile silhouette: smooth cosine dome with subtle wobble
  const wobble = state.shakeT > 0 ? Math.sin(performance.now() * 0.03) * 1.5 : 0;

  ctx.save();
  ctx.translate(wobble, 0);

  // soft shadow under pile inside bowl
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(cx, baseY + 4, r * 0.85, 6, 0, 0, TAU);
  ctx.fillStyle = 'rgba(95, 168, 196, 0.25)';
  ctx.fill();
  ctx.restore();

  // pile body
  const grad = ctx.createLinearGradient(cx, baseY - h, cx, baseY);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.55, '#f3faff');
  grad.addColorStop(1, '#c8e0e8');

  ctx.beginPath();
  ctx.moveTo(cx - r, baseY);
  for (let x = -r; x <= r; x += 2) {
    const nx = x / r;
    const y = baseY - pileSurfaceHeight(nx, h);
    ctx.lineTo(cx + x, y);
  }
  ctx.lineTo(cx + r, baseY);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#9bc4d4';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // (syrup coating is drawn separately so it sits on top of fluff)

  // fluff bumps for texture (small white circles on top)
  const now = performance.now();
  for (const f of state.fluff) {
    // settle the fluff onto the pile surface gradually
    if (!f.settled) {
      // map current position to nearest pile surface
      const dx = f.x - cx;
      if (Math.abs(dx) < r) {
        const nx = dx / r;
        const surfY = baseY - pileSurfaceHeight(nx, h);
        f.targetY = surfY - 1;
      } else {
        f.targetY = baseY - 2;
      }
      f.y += (f.targetY - f.y) * 0.15;
      const age = (now - f.born) / 1000;
      if (age > 1.5) f.settled = true;
    }
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, TAU);
    ctx.fillStyle = `rgba(255,255,255,${f.a})`;
    ctx.fill();
  }

  // sparkle highlights
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.ellipse(cx - r * 0.35, baseY - h * 0.7, r * 0.08, h * 0.18, -0.4, 0, TAU);
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawSyrupCoating(g) {
  if (!state.syrupCoating || state.pileH < 1) return;
  drawCoatingLayer(g, state.syrupCoating);
}

function drawCoatingLayer(g, c) {
  const sh = getPileShape();
  const r = state.pileR * sh.rMul * g.scale;
  const h = state.pileH * sh.hMul * g.scale;
  const cx = g.bowlCenterX;
  const baseY = g.bowlRimY;
  const p = c.progress;
  const ease = 1 - Math.pow(1 - p, 2.5);

  // pile surface y at horizontal offset x from center
  const pileY = (x) => {
    const nx = x / r;
    if (Math.abs(nx) >= 1) return baseY;
    return baseY - pileSurfaceHeight(nx, h);
  };

  // organic descent profile
  const descentAt = (nx) => {
    const wave = Math.sin(nx * 6 + c.noiseSeed) * 0.5 +
                 Math.sin(nx * 11 + c.noiseSeed * 1.7) * 0.5;
    const baseCap = (0.13 + wave * 0.022) * Math.min(1, ease * 2.2);
    let d = baseCap;

    for (const f of c.features) {
      const t = (nx - f.nx) / f.width;
      const at = Math.abs(t);
      if (at >= 1) continue;
      // asymmetric falloff for a wonky organic feel
      const skewed = t >= 0
        ? at / Math.max(0.001, 1 - f.skew * 0.5)
        : at / Math.max(0.001, 1 + f.skew * 0.5);
      if (skewed >= 1) continue;
      const shape = Math.pow(Math.cos(skewed * Math.PI / 2), f.power);
      const fEase = clamp((ease - f.delay) / 0.55, 0, 1);
      const fOut  = 1 - Math.pow(1 - fEase, 2);
      const desc  = f.depth * shape * fOut;
      if (desc > d) d = desc;
    }
    return d;
  };

  // sample the bottom edge as a profile
  const samples = 96;
  const profile = new Array(samples + 1);
  for (let i = 0; i <= samples; i++) {
    const nx = -0.99 + 1.98 * (i / samples);
    const sx = cx + nx * r;
    const sy = pileY(nx * r) + h * descentAt(nx);
    profile[i] = { x: sx, y: sy };
  }

  ctx.save();

  // clip to pile silhouette so syrup can never escape the snow
  ctx.beginPath();
  ctx.moveTo(cx - r, baseY);
  for (let x = -r; x <= r; x += 2) ctx.lineTo(cx + x, pileY(x));
  ctx.lineTo(cx + r, baseY);
  ctx.closePath();
  ctx.clip();

  // build a smooth curve through the profile using quadratic-with-midpoint smoothing
  ctx.beginPath();
  ctx.moveTo(profile[0].x, profile[0].y);
  for (let i = 1; i < profile.length - 1; i++) {
    const cp = profile[i];
    const next = profile[i + 1];
    const midX = (cp.x + next.x) * 0.5;
    const midY = (cp.y + next.y) * 0.5;
    ctx.quadraticCurveTo(cp.x, cp.y, midX, midY);
  }
  ctx.lineTo(profile[profile.length - 1].x, profile[profile.length - 1].y);
  // close around the top of the pile (high above the visible area)
  ctx.lineTo(cx + r, baseY - h * 1.4);
  ctx.lineTo(cx - r, baseY - h * 1.4);
  ctx.closePath();

  // fill with vertical gradient for subtle depth (no harsh shading)
  const grad = ctx.createLinearGradient(cx, baseY - h, cx, baseY);
  grad.addColorStop(0,    c.lightColor);
  grad.addColorStop(0.55, c.color);
  grad.addColorStop(1,    c.darkColor);
  ctx.fillStyle = grad;
  ctx.fill();

  // hand-drawn-style outline along the bottom edge only (gives illustrated feel)
  ctx.beginPath();
  ctx.moveTo(profile[0].x, profile[0].y);
  for (let i = 1; i < profile.length - 1; i++) {
    const cp = profile[i];
    const next = profile[i + 1];
    const midX = (cp.x + next.x) * 0.5;
    const midY = (cp.y + next.y) * 0.5;
    ctx.quadraticCurveTo(cp.x, cp.y, midX, midY);
  }
  ctx.lineTo(profile[profile.length - 1].x, profile[profile.length - 1].y);
  ctx.strokeStyle = c.darkColor;
  ctx.globalAlpha = 0.45;
  ctx.lineWidth = Math.max(1, 1.3 * g.scale);
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.globalAlpha = 1;

  // soft glossy highlight on the cap — single elongated curve, no dots
  const highlightA = clamp((ease - 0.35) * 1.8, 0, 1) * 0.55;
  if (highlightA > 0) {
    ctx.globalAlpha = highlightA;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    // soft crescent following the dome
    const hx = cx - r * 0.18;
    const hy = baseY - h * 0.92;
    ctx.ellipse(hx, hy, r * 0.34, h * 0.04, -0.28, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawSyrupStream(g) {
  const c = state.syrupCoating;
  if (!c) return;
  const p = c.progress;
  if (p >= 0.5) return; // stream only during first half of pour

  const r = state.pileR * g.scale;
  const h = state.pileH * g.scale;
  const cx = g.bowlCenterX;
  const baseY = g.bowlRimY;
  const pileTop = baseY - h;

  // stream falls from above the pile down to its top
  const streamStartY = Math.max(g.machineBottomY + 8 * g.scale, pileTop - 70 * g.scale);
  const streamEndY = pileTop + 2;
  // taper: full at start of pour, shrinking as we approach 0.5
  const t = clamp(p / 0.5, 0, 1);
  // fade in quickly, fade out near end
  const alpha = Math.min(1, t * 6) * Math.min(1, (1 - t) * 3 + 0.3);
  if (alpha <= 0.02 || streamEndY <= streamStartY) return;

  const wTop = 2.4 * g.scale;
  const wBot = 4.0 * g.scale;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = c.darkColor;
  ctx.beginPath();
  ctx.moveTo(cx - wTop, streamStartY);
  ctx.lineTo(cx + wTop, streamStartY);
  ctx.lineTo(cx + wBot, streamEndY);
  ctx.lineTo(cx - wBot, streamEndY);
  ctx.closePath();
  ctx.fill();
  // bright center line
  ctx.fillStyle = c.lightColor;
  ctx.beginPath();
  ctx.moveTo(cx - wTop * 0.4, streamStartY);
  ctx.lineTo(cx + wTop * 0.4, streamStartY);
  ctx.lineTo(cx + wBot * 0.35, streamEndY);
  ctx.lineTo(cx - wBot * 0.35, streamEndY);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawMachine(g) {
  drawMachineBody(g);
  drawHandle(g);
}

// 機械本体は sprite (= 動かない部分)。
// 後で user 生成画像を assets/images/sprites/machine-body.png に上書きで即反映。
function drawMachineBody(g) {
  if (!spriteReady(sprites.machine)) return;
  // reveal phase では機械を完全に隠す (= 完成かき氷だけを「展示」)
  if (state.phase === 'reveal') return;
  // sprite was exported with scale=1, sprite size 240×440, machine 足元 at sprite_h - 10 = 430.
  const drawW = 240 * g.scale;
  const drawH = 440 * g.scale;
  ctx.save();
  // reward done では機械を fade out して「完成かき氷 = 主役」 に視線を譲る (= Codex 案 B)
  if (state.mode === 'reward' && state.phase === 'done') ctx.globalAlpha = 0.30;
  ctx.drawImage(
    sprites.machine,
    g.machineCenterX - drawW / 2,
    g.machineBottomY - 430 * g.scale,
    drawW,
    drawH
  );
  ctx.restore();
}

// ハンドルは state.handleAngle で常時動くので procedural のまま。
function drawHandle(g) {
  // reveal phase ではハンドルも非表示
  if (state.phase === 'reveal') return;
  const px = g.handlePivotX;
  const py = g.handlePivotY;
  const armLen = g.armLen;
  const s = g.scale;

  ctx.save();
  // reward done では機械と一緒にハンドルも薄くする (= Codex 案 B)
  if (state.mode === 'reward' && state.phase === 'done') ctx.globalAlpha = 0.30;
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#2a3a4d';

  // pivot circle (bolt)
  ctx.fillStyle = '#6c757d';
  ctx.beginPath();
  ctx.arc(px, py, 6 * s, 0, TAU);
  ctx.fill();
  ctx.stroke();

  // arm
  const angle = state.handleAngle;
  const tipX = px + Math.cos(angle) * armLen;
  const tipY = py + Math.sin(angle) * armLen;
  ctx.save();
  ctx.lineWidth = 6 * s;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#c89668';
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(tipX, tipY);
  ctx.stroke();
  // dark outline on arm
  ctx.lineWidth = 8 * s;
  ctx.strokeStyle = '#2a3a4d';
  ctx.globalCompositeOperation = 'destination-over';
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(tipX, tipY);
  ctx.stroke();
  ctx.restore();

  // handle grip
  ctx.save();
  ctx.fillStyle = '#8b5e3c';
  ctx.beginPath();
  ctx.arc(tipX, tipY, 11 * s, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#2a3a4d';
  ctx.lineWidth = 3;
  ctx.stroke();
  // wood ring detail
  ctx.beginPath();
  ctx.arc(tipX, tipY, 6 * s, 0, TAU);
  ctx.strokeStyle = '#5e3e26';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();

  // arrow hint if rotations is low
  if (state.rotations < 1 && !state.isDragging) {
    ctx.save();
    ctx.globalAlpha = 0.6 + Math.sin(performance.now() * 0.005) * 0.3;
    ctx.translate(px, py);
    ctx.fillStyle = '#e94560';
    ctx.font = `${16 * s}px 'Yusei Magic', serif`;
    ctx.textAlign = 'center';
    // circular arrow indicator using arc
    ctx.beginPath();
    ctx.lineWidth = 3 * s;
    ctx.strokeStyle = '#e94560';
    ctx.arc(0, 0, armLen + 14 * s, -0.7, 4.5);
    ctx.stroke();
    // arrowhead
    const aa = 4.5;
    const ax = (armLen + 14 * s) * Math.cos(aa);
    const ay = (armLen + 14 * s) * Math.sin(aa);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - 8 * s, ay - 2 * s);
    ctx.lineTo(ax - 4 * s, ay + 8 * s);
    ctx.closePath();
    ctx.fillStyle = '#e94560';
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

// ---------- わたあめ「ふわふわ風あつめ」 入力系 / M12.5 ----------
// 画面下/両端から綿粒が浮上、 指で粒を引いて棒へ寄せると吸収 → 雲が育つ。

function spawnCottonParticle() {
  const side = Math.random() < 0.5 ? -1 : 1;
  state.cottonParticles.push({
    x: side < 0 ? rand(W * 0.05, W * 0.30) : rand(W * 0.70, W * 0.95),
    y: H + 10,
    vx: side < 0 ? rand(0.05, 0.25) : rand(-0.25, -0.05),
    vy: rand(-0.95, -0.55),
    size: rand(7, 13),
    side,
    age: 0,
  });
  if (state.cottonParticles.length > 40) state.cottonParticles.shift();
}

function updateCottonParticles(dt) {
  if (state.activity !== 'cottoncandy') return;
  if (state.phase !== 'playing' && state.phase !== 'ready') return;
  const g = geometry();
  const stickCX = g.bowlCenterX;
  const cloudH = state.pileH * 1.32 * g.scale;
  const stickCY = g.bowlRimY - Math.max(40, cloudH * 0.5);

  for (const p of state.cottonParticles) {
    // 棒方向への軽い引力 (= 指で触れなくても自然に中央へ向かう、 浮上時の補助)
    const adx = stickCX - p.x;
    const ady = stickCY - p.y;
    const adist = Math.max(1, Math.hypot(adx, ady));
    p.vx += (adx / adist) * 0.012 * dt;
    p.vy += (ady / adist) * 0.012 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.age += dt;
    // 棒中心に近づいたら吸収 → 雲が育つ (= 判定広め)
    const dx = stickCX - p.x;
    const dy = stickCY - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 45) {
      state.shavings += 3;
      updatePile();
      // 寄せた方向で偏り (= side -1 = 左から寄せ → 左 bump、 +1 = 右から寄せ → 右 bump)
      state.cottonBalance += -p.side * 0.08;
      // 「自分の雲」 用に pileProfile を加算 (= 寄せた位置に小ふくらみ)
      if (!state.pileProfile) state.pileProfile = [];
      if (state.pileProfile.length < 12) {
        state.pileProfile.push({
          nx: clamp(-p.side * 0.5 + rand(-0.3, 0.3), -0.85, 0.85),
          depth: rand(0.03, 0.07),
          width: rand(0.10, 0.18),
        });
      }
      sndRotationBonus();  // 「キラン」 = 吸収 SE 流用
      p.captured = true;
    }
  }
  state.cottonParticles = state.cottonParticles.filter(p =>
    !p.captured && p.y > -50 && p.y < H + 100 && p.age < 600
  );

  // 定期生成 (= playing 中はずっと粒が浮上)
  state.cottonSpawnT += dt;
  if (state.cottonSpawnT > 14) {  // ≈ 0.23s 間隔 (= 多めに浮上で 3-5 歳が触りやすい)
    spawnCottonParticle();
    state.cottonSpawnT = 0;
  }
}

function drawCottonParticles() {
  if (state.activity !== 'cottoncandy') return;
  if (state.phase !== 'playing' && state.phase !== 'ready') return;
  for (const p of state.cottonParticles) {
    ctx.save();
    // ふんわり粒: 中心明 + 外周淡
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
    grad.addColorStop(0.6, 'rgba(255, 248, 240, 0.7)');
    grad.addColorStop(1, 'rgba(255, 220, 195, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

// ---------- わたあめ (cottoncandy) procedural 描画 / M12.1 ----------
// 機械本体 (= 砂糖を回す円筒)、 棒 (= 雲を貫く茶色の縦棒)、 雲 (= ふんわり山) を描画。
// sprite 化は M12.3 で予定 (= 既存 sprite path に乗せる)。

function drawCandyMachine(g) {
  if (state.phase === 'reveal') return;
  const cx = g.machineCenterX;
  const bottomY = g.machineBottomY;
  const topY = g.machineTopY;
  const s = g.scale;

  ctx.save();
  if (state.mode === 'reward' && state.phase === 'done') ctx.globalAlpha = 0.30;
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#2a3a4d';

  // 円筒本体
  ctx.fillStyle = '#f5f0e0';
  roundRect(cx - 50 * s, topY + 20 * s, 100 * s, (bottomY - topY) - 20 * s, 8 * s);
  ctx.fill();
  ctx.stroke();

  // 上面開口部 (= 砂糖が出てくる)
  ctx.fillStyle = '#777';
  ctx.beginPath();
  ctx.ellipse(cx, topY + 18 * s, 38 * s, 9 * s, 0, 0, TAU);
  ctx.fill();
  ctx.stroke();
  // 内側の影
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.ellipse(cx, topY + 18 * s, 30 * s, 5 * s, 0, 0, TAU);
  ctx.fill();

  // ラベル (= 「糖」)
  ctx.fillStyle = '#fff8e1';
  roundRect(cx - 28 * s, topY + 48 * s, 56 * s, 32 * s, 4 * s);
  ctx.fill();
  ctx.strokeStyle = '#2a3a4d';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#e94560';
  ctx.font = `${20 * s}px 'Yusei Magic', serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('糖', cx, topY + 64 * s);

  // ヒーター (= 機械内部の オレンジ glow を 機械下半分にうっすら)
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#2a3a4d';
  const heatY = topY + 100 * s;
  ctx.fillStyle = '#ffb347';
  ctx.globalAlpha = 0.55;
  roundRect(cx - 36 * s, heatY, 72 * s, 16 * s, 4 * s);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.stroke();

  // 足
  ctx.fillStyle = '#3d3d3d';
  roundRect(cx - 54 * s, bottomY - 2, 108 * s, 6 * s, 2);
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

// 棒 (= 雲を貫く縦棒)。 雲とハンドルの間の連結を視覚化。
function drawStick(g) {
  if (state.phase === 'reveal') {
    // reveal でも棒は完成品の一部なので表示 (= 機械は隠す、 棒は雲と一体)
  }
  const cx = g.bowlCenterX;
  const baseY = g.bowlRimY;
  const s = g.scale;
  // 棒の長さ: 雲の中央付近まで突き抜ける
  const cloudH = state.pileH * 1.32 * s;  // drawCloud と合わせる
  const stickTopY = baseY - cloudH * 0.55;
  const stickBottomY = baseY + (state.phase === 'reveal' ? 20 * s : 0);

  ctx.save();
  if (state.mode === 'reward' && state.phase === 'done') ctx.globalAlpha = 0.30;
  ctx.fillStyle = '#c89668';
  ctx.strokeStyle = '#5e3e26';
  ctx.lineWidth = 2;
  const stickX = cx - 3 * s;
  const stickW = 6 * s;
  ctx.fillRect(stickX, stickTopY, stickW, stickBottomY - stickTopY);
  ctx.strokeRect(stickX, stickTopY, stickW, stickBottomY - stickTopY);
  ctx.restore();
}

// 雲 (= ふんわりした わたあめ)。 既存 pileH/pileR を流用、 ふくらみを 3 つの bump で表現
function drawCloud(g) {
  if (state.pileH < 1) return;
  const r = state.pileR * 1.18 * g.scale;
  const h = state.pileH * 1.32 * g.scale;
  const cx = g.bowlCenterX;
  const baseY = g.bowlRimY;

  // 雲の色: syrup 未選択は白〜淡橙、 選択後は その色 (= 雲全体に染み込む演出)
  let topCol = '#ffffff', midCol = '#fff7f3', botCol = '#ffdbc8';
  if (state.syrupCoating) {
    const c = state.syrupCoating;
    const t = c.progress;
    topCol = mixColorHex('#ffffff', c.lightColor, t);
    midCol = mixColorHex('#fff7f3', c.color,      t);
    botCol = mixColorHex('#ffdbc8', c.darkColor,  t);
  }
  const grad = ctx.createLinearGradient(cx, baseY - h, cx, baseY);
  grad.addColorStop(0,    topCol);
  grad.addColorStop(0.55, midCol);
  grad.addColorStop(1,    botCol);

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx - r, baseY);
  for (let x = -r; x <= r; x += 2) {
    const nx = x / r;
    let dome = h * Math.pow(Math.cos(nx * Math.PI / 2), 0.7);  // ふんわり = 低 power
    // ふくらみを 3 つ加算 (= 「雲」 ぽさ)
    dome += h * 0.10 * Math.sin(nx * Math.PI * 2 + 1.2);
    dome += h * 0.06 * Math.cos(nx * Math.PI * 3);
    // pileProfile の bump (= 自分のかき氷のでこぼこ) も雲に適用 → ユニーク化
    if (state.pileProfile) {
      for (const f of state.pileProfile) {
        const t = (nx - f.nx) / f.width;
        if (Math.abs(t) >= 1) continue;
        dome += h * f.depth * Math.pow(Math.cos(t * Math.PI / 2), 2);
      }
    }
    ctx.lineTo(cx + x, baseY - Math.max(0, dome));
  }
  ctx.lineTo(cx + r, baseY);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#e8c8a8';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawParticles() {
  for (const p of state.particles) {
    if (p.isSpark) {
      // 4-point sparkle star with glow halo
      const lifeFade = clamp(1 - p.life / 50, 0, 1);
      ctx.save();
      ctx.translate(p.x, p.y);
      // halo
      const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size * 5);
      halo.addColorStop(0, `rgba(255,255,255,${0.55 * lifeFade})`);
      halo.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = halo;
      ctx.fillRect(-p.size * 5, -p.size * 5, p.size * 10, p.size * 10);
      // 4-point star
      ctx.fillStyle = p.color || '#ffffff';
      ctx.beginPath();
      const s = p.size * 2.3 * lifeFade;
      ctx.moveTo(0, -s);
      ctx.lineTo(s * 0.3, -s * 0.3);
      ctx.lineTo(s, 0);
      ctx.lineTo(s * 0.3, s * 0.3);
      ctx.lineTo(0, s);
      ctx.lineTo(-s * 0.3, s * 0.3);
      ctx.lineTo(-s, 0);
      ctx.lineTo(-s * 0.3, -s * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      continue;
    }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle  = p.color  || '#fff';
    ctx.strokeStyle = p.stroke || 'rgba(95, 168, 196, 0.6)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size, p.size * p.tilt, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

// ---------- celebration: characters, sparkles, praise banner ----------

function drawPenguin(x, y, size, t, opts = {}) {
  if (!spriteReady(sprites.penguin)) return;
  const bob = Math.sin(t * 3 + (opts.phase || 0)) * 2;
  // sprite 256x256 was exported with drawPenguin(W/2, H*0.80, 110, ...)
  // → 表示時の scale: drawSize = size * (256 / 110)
  const drawSize = size * 256 / 110;
  ctx.save();
  ctx.translate(x, y + bob);
  if (opts.flip) ctx.scale(-1, 1);
  ctx.drawImage(sprites.penguin, -drawSize / 2, -drawSize * 0.80, drawSize, drawSize);
  ctx.restore();
}

function drawShirokuma(x, y, size, t, opts = {}) {
  if (!spriteReady(sprites.shirokuma)) return;
  const bob = Math.sin(t * 2.8 + (opts.phase || 0)) * 2;
  const drawSize = size * 256 / 110;
  ctx.save();
  ctx.translate(x, y + bob);
  if (opts.flip) ctx.scale(-1, 1);
  ctx.drawImage(sprites.shirokuma, -drawSize / 2, -drawSize * 0.80, drawSize, drawSize);
  ctx.restore();
}

function drawChick(x, y, size, t, opts = {}) {
  if (!spriteReady(sprites.chick)) return;
  const bob = Math.sin(t * 3.6 + (opts.phase || 0)) * 4;
  // sprite 256x256 was exported with drawChick(W/2, H*0.55, 96, ...)
  // chick は ground anchor ではなく "中心 anchor" (= sprite 内 y=0.55)
  const drawSize = size * 256 / 96;
  ctx.save();
  ctx.translate(x, y + bob);
  if (opts.flip) ctx.scale(-1, 1);
  ctx.drawImage(sprites.chick, -drawSize / 2, -drawSize * 0.55, drawSize, drawSize);
  ctx.restore();
}

function drawSparkleStar(x, y, size, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  // 4-point sparkle (diamond + cross)
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.quadraticCurveTo(size * 0.18, -size * 0.18, size, 0);
  ctx.quadraticCurveTo(size * 0.18,  size * 0.18, 0, size);
  ctx.quadraticCurveTo(-size * 0.18, size * 0.18, -size, 0);
  ctx.quadraticCurveTo(-size * 0.18, -size * 0.18, 0, -size);
  ctx.closePath();
  ctx.fill();
  // center bright dot
  ctx.fillStyle = '#fff';
  ctx.globalAlpha = alpha * 0.9;
  ctx.beginPath();
  ctx.arc(0, 0, size * 0.25, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawCelebration(g) {
  if (!state.celebrating) return;
  const ct = state.celebrationT;

  // sparkles (in canvas coords, framed around the kakigori)
  for (const sp of state.sparkles) {
    const tw = (Math.sin(ct * 3.2 + sp.phase) + 1) * 0.5; // 0..1
    const fadeIn = clamp(ct * 1.4, 0, 1);
    const size = sp.size * (0.55 + tw * 0.65);
    drawSparkleStar(sp.x, sp.y, size, sp.color, (0.55 + tw * 0.4) * fadeIn);
  }

  // characters slide up from below
  for (const char of state.characters) {
    const localT = ct - char.entryT;
    if (localT < 0) continue;
    const entry = clamp(localT / 0.55, 0, 1);
    const eased = 1 - Math.pow(1 - entry, 3);
    const yOff = (1 - eased) * 110;
    // a tiny overshoot wobble
    const wobble = entry < 1 ? Math.sin(entry * Math.PI) * -6 : 0;
    const y = char.baseY + yOff + wobble;
    const opts = { phase: char.bobPhase, flip: char.flip };
    if (char.type === 'penguin')        drawPenguin(char.baseX,   y, 54, ct, opts);
    else if (char.type === 'shirokuma') drawShirokuma(char.baseX, y, 56, ct, opts);
    else if (char.type === 'chick')     drawChick(char.baseX,     y, 34, ct, opts);
  }

  // Chomp hit indicators — rise from the multiplier badge position so they're
  // always in the user's line of sight (not at scattered click positions).
  // Compute the anchor (same as mult badge below)
  const stablePileH = (state.phase === 'eating' || state.phase === 'done')
    ? state.frozenPileH * g.scale
    : state.pileH * g.scale;
  const anchorX = g.bowlCenterX;
  const anchorY = Math.max(95, g.bowlRimY - stablePileH - 32 * g.scale);

  for (const fx of state.chompFx) {
    const t = fx.life / 32; // 0..1
    const lift = -t * 60;
    const alpha = 1 - t;
    const scale = 1.2 + t * 0.7;
    const wobble = Math.sin(t * Math.PI * 3) * 0.06 * (1 - t);
    ctx.save();
    ctx.translate(anchorX, anchorY - 36 + lift);
    ctx.globalAlpha = alpha;
    ctx.scale(scale + wobble, scale - wobble);
    ctx.font = 'bold 36px "Yusei Magic", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // shadow stack
    for (let i = 2; i >= 1; i--) {
      ctx.fillStyle = `rgba(255,94,122,${0.3 / i})`;
      ctx.fillText(fx.word, i * 1.8, i * 1.8);
    }
    ctx.lineWidth = 8;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#fff';
    ctx.strokeText(fx.word, 0, 0);
    ctx.fillStyle = '#ff2a5a';
    ctx.fillText(fx.word, 0, 0);
    ctx.restore();
  }

  // Live multiplier badge during eating — stable position (uses frozen pile h)
  if (state.phase === 'eating' && state.eatingClicks > 0) {
    const pulse = 1 + state.multBadgePulse * 0.55;
    const tier = state.eatingLiveMult;
    let col;
    if      (tier >= 4)   col = '#ff5e7a';
    else if (tier >= 3)   col = '#ff9d3d';
    else if (tier >= 2)   col = '#ffce4a';
    else                  col = '#7cc0ec';
    ctx.save();
    ctx.translate(anchorX, anchorY);
    ctx.scale(pulse, pulse);
    // glow halo around mult
    const haloG = ctx.createRadialGradient(0, 0, 0, 0, 0, 60);
    haloG.addColorStop(0, col + '88');
    haloG.addColorStop(1, col + '00');
    ctx.fillStyle = haloG;
    ctx.fillRect(-60, -40, 120, 80);
    ctx.font = 'bold 40px "Yusei Magic", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const txt = '× ' + tier.toFixed(1);
    // shadow stack
    for (let i = 3; i >= 1; i--) {
      ctx.fillStyle = col + Math.round(96 / i).toString(16).padStart(2,'0');
      ctx.fillText(txt, i * 1.5, i * 1.5);
    }
    // outline
    ctx.lineWidth = 9;
    ctx.strokeStyle = '#fff';
    ctx.lineJoin = 'round';
    ctx.strokeText(txt, 0, 0);
    ctx.fillStyle = col;
    ctx.fillText(txt, 0, 0);
    ctx.restore();
  }

  // Top banner — appears later. During 'done' phase, banner gets larger.
  const bannerIn = clamp((ct - 0.35) / 0.5, 0, 1);
  if (bannerIn > 0 && state.praiseLabel) {
    const isReveal = state.phase === 'reveal';
    const isFinal = isReveal || state.phase === 'done';
    const isReward = state.mode === 'reward';
    const isNewRecord = state.heightNewRecord || state.scoreNewRecord;
    // reveal は大きな祝祭バナー、 reward done は見出し縮小、 challenge done は通常〜大
    let fontSize, yPos;
    if (isReveal)                            { fontSize = 30;                       yPos = 50; }
    else if (isReward && state.phase === 'done') { fontSize = 14;                   yPos = 10; }
    else if (state.phase === 'done')         { fontSize = isNewRecord ? 22 : 19;    yPos = 28 - (1 - bannerIn) * 18; }
    else                                     { fontSize = 18;                       yPos = 28 - (1 - bannerIn) * 18; }
    const lines = state.praiseLabel.split('\n');
    ctx.save();
    ctx.globalAlpha = bannerIn;
    ctx.font = `bold ${fontSize}px "Yusei Magic", serif`;
    // measure widest line
    let widest = 0;
    for (const l of lines) widest = Math.max(widest, ctx.measureText(l).width);
    const padX = 24, padY = lines.length > 1 ? 16 : 12;
    const lineH = fontSize + 6;
    const bw = Math.min(W - 16, widest + padX * 2);
    const bh = lineH * lines.length + padY * 2 - 6;
    const bx = W / 2 - bw / 2;
    const by = yPos;

    // 🌈 Bigger glow halo at new records
    if (isNewRecord && isFinal) {
      const haloT = ct * 2;
      ctx.save();
      for (let i = 5; i >= 1; i--) {
        const hue = (haloT * 50 + i * 60) % 360;
        ctx.fillStyle = `hsla(${hue},85%,65%,0.15)`;
        ctx.beginPath();
        roundRect(bx - i * 4, by - i * 4, bw + i * 8, bh + i * 8, 22 + i * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // shadow
    ctx.fillStyle = 'rgba(42,58,77,0.20)';
    ctx.beginPath();
    roundRect(bx + 4, by + 5, bw, bh, 20);
    ctx.fill();
    // banner background — gold for normal, brighter for done, rainbow-tinged for records
    const grad = ctx.createLinearGradient(0, by, 0, by + bh);
    if (isNewRecord && isFinal) {
      const phase = (ct * 0.5) % 1;
      const h1 = (phase * 360) % 360;
      const h2 = ((phase + 0.5) * 360) % 360;
      grad.addColorStop(0, `hsl(${h1},90%,82%)`);
      grad.addColorStop(0.5, '#fff9e3');
      grad.addColorStop(1, `hsl(${h2},90%,72%)`);
    } else if (isFinal) {
      grad.addColorStop(0, '#fff3c4');
      grad.addColorStop(1, '#ffce4a');
    } else {
      grad.addColorStop(0, '#fff9e3');
      grad.addColorStop(1, '#ffe9a8');
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    roundRect(bx, by, bw, bh, 20);
    ctx.fill();
    ctx.strokeStyle = '#2a3a4d';
    ctx.lineWidth = isNewRecord ? 3 : 2.5;
    ctx.stroke();
    // text
    ctx.fillStyle = '#2a3a4d';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const centerY = by + bh / 2;
    const startY = centerY - (lines.length - 1) * lineH / 2;
    for (let i = 0; i < lines.length; i++) {
      // Headline (first line) gets rainbow color cycling at new records
      if (i === 0 && isNewRecord && isFinal) {
        const hue = (ct * 80) % 360;
        // outline
        ctx.lineWidth = 5;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#fff';
        ctx.strokeText(lines[i], W / 2, startY + i * lineH);
        ctx.fillStyle = `hsl(${hue},85%,45%)`;
        ctx.fillText(lines[i], W / 2, startY + i * lineH);
        ctx.fillStyle = '#2a3a4d';
      } else {
        ctx.fillText(lines[i], W / 2, startY + i * lineH);
      }
    }
    ctx.restore();
  }
}

function drawScene() {
  ctx.clearRect(0, 0, W, H);
  const g = geometry();

  // Subtle scene shake when timer is in last 5 seconds (gets stronger as time runs out)
  let shakeX = 0, shakeY = 0;
  if (state.warningPulseT > 0) {
    const wp = state.warningPulseT;
    // intensity grows as the player gets more frantic
    const intensity = Math.min(1, wp / 3) * 2.5;
    shakeX = Math.sin(wp * 18) * intensity;
    shakeY = Math.cos(wp * 14) * intensity * 0.7;
    ctx.save();
    ctx.translate(shakeX, shakeY);
  }

  // distant background: sun + clouds + lanterns + confetti
  drawBackground(g);

  // 🔥 Last-5-sec sky warning — subtle red overlay creeping in
  if (state.warningPulseT > 0) {
    const wp = state.warningPulseT;
    const tint = Math.min(0.22, wp * 0.07);
    const pulse = (Math.sin(wp * 6) + 1) * 0.5; // 0..1
    ctx.save();
    ctx.fillStyle = `rgba(255, 80, 90, ${tint * (0.6 + pulse * 0.4)})`;
    ctx.fillRect(0, 0, W, H * 0.6);
    ctx.restore();
  }

  // 🐧 BACK layer animals — drawn first, end up behind the bowl/machine
  drawBgAnimals(g, 'back');

  // activity 分岐: かき氷 (= 既存) vs わたあめ (= M12.1)
  if (state.activity === 'cottoncandy') {
    drawCandyMachine(g);
    drawCloud(g);   // 内部で syrupCoating の色を反映 (= 雲全体着色)
    drawStick(g);   // 雲の前面、 棒が貫く感
    drawCottonParticles();  // M12.5: 漂う綿粒 (= 雲・棒の手前に重ねる)
  } else {
    drawBowl(g);
    drawPile(g);
    drawSyrupCoating(g);
    drawSyrupStream(g);
    drawMachine(g);
  }

  // ✨ Pile surface sparkles — make the ice glitter magically
  drawPileSparkles();

  // 💨 cold steam wisps rising off the kakigori
  drawColdSteam(g);

  // 🐧 FRONT layer animals — drawn after bowl & machine so they walk in front,
  // adding visual depth and crowd-feel
  drawBgAnimals(g, 'front');

  drawParticles();
  drawRotationFx(g);
  // 💨 manga-style speed lines around the handle when cranking
  drawSpeedLines(g);
  // 🎆 fireworks (only during records)
  drawFireworks();
  // celebration overlays (in canvas coords, not transformed by camera)
  drawCelebration(g);
  // 🔥 combo badge + milestone celebration text
  drawComboBadge(g);
  drawComboCelebrate(g);
  // 🎓 first-time handle hint
  drawHandleHint(g);
  // step prompts and scene transitions on top of everything
  drawEatingPrompt(g);
  drawTransition(g);
  // ⏰ TIME UP flash + slight slow-mo veil + radial shockwave
  if (state.timeUpFlashT > 0) {
    const total = 1.0;
    const p = state.timeUpFlashT / total; // 1 → 0
    const flashAlpha = Math.pow(p, 1.5) * 0.85;
    ctx.save();
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
    // Radial shockwave ring expanding outward
    const expand = 1 - p;
    const ringR = expand * Math.max(W, H) * 0.9;
    if (ringR > 10) {
      const ringA = clamp(1 - expand, 0, 1) * 0.7;
      ctx.strokeStyle = `rgba(255,206,74,${ringA})`;
      ctx.lineWidth = 8 * (1 - expand * 0.5);
      ctx.beginPath();
      ctx.arc(W / 2, H * 0.55, ringR, 0, TAU);
      ctx.stroke();
      // inner secondary ring
      ctx.strokeStyle = `rgba(255,94,122,${ringA * 0.7})`;
      ctx.lineWidth = 4 * (1 - expand * 0.5);
      ctx.beginPath();
      ctx.arc(W / 2, H * 0.55, ringR * 0.7, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }
  // 🌈 New-record rainbow flash sweeping across the screen
  if (state.recordFlashT > 0) {
    const total = 0.9;
    const p = state.recordFlashT / total; // 1 → 0
    const t = performance.now() / 1000;
    const alpha = Math.pow(p, 0.8) * 0.42;
    const grad = ctx.createLinearGradient(0, 0, W, H);
    const o = (t * 0.6) % 1;
    grad.addColorStop((0   + o) % 1, `rgba(255,94,122,${alpha})`);
    grad.addColorStop((0.2 + o) % 1, `rgba(255,216,74,${alpha})`);
    grad.addColorStop((0.4 + o) % 1, `rgba(108,186,135,${alpha})`);
    grad.addColorStop((0.6 + o) % 1, `rgba(66,135,214,${alpha})`);
    grad.addColorStop((0.8 + o) % 1, `rgba(160,108,213,${alpha})`);
    grad.addColorStop((1.0 + o) % 1, `rgba(255,94,122,${alpha})`);
    ctx.save();
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  // 🎉 title screen overlay sits on top of everything during 'title' phase
  drawTitleScreen(g);

  if (state.warningPulseT > 0) {
    ctx.restore();
  }
}

// Big "連打で食べて！" prompt during eating (and the entering transition).
// During the 1.6s transition: white flash + huge text in the middle.
// After transition, before first bite: smaller pulsing reminder.
function drawEatingPrompt(g) {
  if (state.phase !== 'eating') return;
  if (state.transitionT > 0) return; // transition draws its own version
  if (state.eatingClicks > 0) return; // hide as soon as user starts eating

  const t = performance.now() / 1000;
  const pulse = 1 + Math.sin(t * 4) * 0.06;
  ctx.save();
  ctx.translate(W / 2, H * 0.38);
  ctx.scale(pulse, pulse);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Step pill
  ctx.font = 'bold 14px "DotGothic16", monospace';
  ctx.fillStyle = '#2a3a4d';
  ctx.fillText('STEP 3 / 3', 0, -42);
  // Main text
  ctx.font = 'bold 38px "Yusei Magic", serif';
  ctx.lineWidth = 9;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#fff';
  ctx.strokeText('🥄 連打で食べて！', 0, 0);
  ctx.fillStyle = '#ff5e7a';
  ctx.fillText('🥄 連打で食べて！', 0, 0);
  // Hint
  ctx.font = 'bold 16px "Zen Maru Gothic", sans-serif';
  ctx.lineWidth = 5;
  ctx.strokeStyle = '#fff';
  ctx.strokeText('クリック / タップを高速連打！', 0, 36);
  ctx.fillStyle = '#2a3a4d';
  ctx.fillText('クリック / タップを高速連打！', 0, 36);
  ctx.restore();
}

function drawTransition(g) {
  if (state.transitionT <= 0) return;
  const total = 1.6;
  const elapsed = total - state.transitionT;

  // Phase 1: a quick white flash for ~0.25s
  if (elapsed < 0.30) {
    const a = (0.30 - elapsed) / 0.30;
    ctx.save();
    ctx.fillStyle = `rgba(255, 250, 235, ${a * 0.85})`;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // Phase 2: big "STEP 3 / 連打で食べて！" overlay (eases in, holds, eases out)
  const textT = clamp((elapsed - 0.08) / (total - 0.10), 0, 1);
  const inEase  = Math.min(1, textT * 4);            // grow over 25% of remaining
  const outEase = textT > 0.78 ? (1 - (textT - 0.78) / 0.22) : 1;
  const alpha = inEase * outEase;
  const scale = 0.6 + inEase * 0.45;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H * 0.4);
  ctx.scale(scale, scale);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Step pill text
  ctx.font = 'bold 16px "DotGothic16", monospace';
  ctx.lineWidth = 5;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#fff';
  ctx.strokeText('▶  STEP 3 / 3  ◀', 0, -52);
  ctx.fillStyle = '#2a3a4d';
  ctx.fillText('▶  STEP 3 / 3  ◀', 0, -52);
  // Big title
  ctx.font = 'bold 46px "Yusei Magic", serif';
  ctx.lineWidth = 11;
  ctx.strokeStyle = '#fff';
  ctx.strokeText('🥄 連打で食べて！', 0, 0);
  ctx.fillStyle = '#ff5e7a';
  ctx.fillText('🥄 連打で食べて！', 0, 0);
  // Sub
  ctx.font = 'bold 18px "Zen Maru Gothic", sans-serif';
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#fff';
  ctx.strokeText('早ければ早いほど高倍率 ×5.0まで！', 0, 44);
  ctx.fillStyle = '#2a3a4d';
  ctx.fillText('早ければ早いほど高倍率 ×5.0まで！', 0, 44);
  ctx.restore();
}

function drawRotationFx(g) {
  if (!state.rotationFx.length) return;
  // anchor near top of machine
  const x = g.machineCenterX;
  const y = g.machineTopY + 16 * g.scale;
  for (const fx of state.rotationFx) {
    const t = fx.life / 36;
    const lift = -t * 50;
    const alpha = 1 - t;
    const scale = 1 + t * 0.6;
    ctx.save();
    ctx.translate(x, y + lift);
    ctx.globalAlpha = alpha;
    ctx.scale(scale, scale);
    // 💥 burst sparkles around the text
    ctx.fillStyle = `rgba(255,206,74,${alpha * 0.5})`;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU + t * 3;
      const r = 22 + t * 24;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      ctx.beginPath();
      ctx.arc(px, py, 2, 0, TAU);
      ctx.fill();
    }
    ctx.font = 'bold 20px "Yusei Magic", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 6;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#fff';
    ctx.strokeText('⭐ +15 ボーナス！', 0, 0);
    ctx.fillStyle = '#ff7e3a';
    ctx.fillText('⭐ +15 ボーナス！', 0, 0);
    ctx.restore();
  }
}

function drawBackground(g) {
  // sun — gradually grows as the pile gets taller, suggesting "rising higher"
  ctx.save();
  // The pile growth scales the sun from 1.0× to about 2.4× over a tall pile
  const sunGrowth = 1 + clamp(state.pileH / 600, 0, 1.4);
  const sx = W * 0.82;
  const sy = 60 - clamp(state.pileH / 800, 0, 0.5) * 18; // drift slightly upward too
  const sr = 28 * sunGrowth;
  const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 2);
  sg.addColorStop(0, 'rgba(255, 224, 130, 0.9)');
  sg.addColorStop(1, 'rgba(255, 224, 130, 0)');
  ctx.fillStyle = sg;
  ctx.fillRect(sx - sr * 2, sy - sr * 2, sr * 4, sr * 4);
  ctx.fillStyle = '#fff5b8';
  ctx.beginPath();
  ctx.arc(sx, sy, sr * 0.7, 0, TAU);
  ctx.fill();
  ctx.restore();

  // ☁️ drifting clouds add ambient motion
  drawClouds();
  // 🏮 paper lanterns hanging across the top of the scene
  drawLanterns(g);
  // 🎉 light scatter of confetti drifting forever
  drawConfettiBg();

  // horizon strip
  ctx.fillStyle = 'rgba(255, 220, 200, 0.5)';
  ctx.fillRect(0, H * 0.55, W, 2);
}

// ---------- 🏮 festival decorations ----------
// Paper lanterns + falling confetti make the canvas top feel like a real
// summer matsuri. Lanterns sway in place; confetti drifts down forever.
function initLanterns() {
  state.lanterns = [];
  const colors = ['#ff5e7a', '#ffce4a', '#6cba87', '#f08a4b', '#e94560', '#4287d6', '#ff9d3d'];
  const count = 7;
  for (let i = 0; i < count; i++) {
    state.lanterns.push({
      x: (W / (count + 1)) * (i + 1) + rand(-12, 12),
      y: rand(20, 38),
      size: rand(15, 22),
      color: colors[i % colors.length],
      phase: rand(0, TAU),
    });
  }
  // 🎌 colorful triangle flag string slightly below the lanterns
  state.flags = [];
  const flagColors = ['#ff5e7a','#ffd84a','#6cba87','#4287d6','#f08a4b','#a06cd5'];
  const flagCount = 14;
  for (let i = 0; i < flagCount; i++) {
    state.flags.push({
      x: (W / flagCount) * (i + 0.5),
      color: flagColors[i % flagColors.length],
      phase: rand(0, TAU),
    });
  }
  // confetti — light scatter that drifts forever
  state.confettiBg = [];
  for (let i = 0; i < 28; i++) {
    state.confettiBg.push({
      x: rand(0, W),
      y: rand(-H, H * 0.5),
      vx: rand(-0.3, 0.3),
      vy: rand(0.15, 0.55),
      rot: rand(0, TAU),
      vrot: rand(-0.05, 0.05),
      color: ['#ff5e7a','#ffd84a','#6cba87','#4287d6','#f08a4b','#a06cd5'][i % 6],
      size: rand(3, 7),
      shape: i % 3, // 0=rect 1=circle 2=triangle
    });
  }
}

function updateFestivalBits(dt) {
  // confetti drift
  for (const c of state.confettiBg) {
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.vrot * dt;
    if (c.y > H + 8) {
      c.y = -10;
      c.x = rand(0, W);
    }
    if (c.x < -10) c.x = W + 10;
    else if (c.x > W + 10) c.x = -10;
  }
}

function drawLanterns(g) {
  if (!state.lanterns.length) return;
  const t = performance.now() / 1000;

  // 🎌 Flag string just below the lanterns - draw first (background)
  if (state.flags && state.flags.length) {
    const flagY = 65;
    ctx.save();
    ctx.strokeStyle = 'rgba(42,58,77,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, flagY);
    for (let x = 0; x <= W; x += 6) {
      const sag = Math.sin((x / W) * Math.PI) * 3;
      ctx.lineTo(x, flagY + sag);
    }
    ctx.stroke();
    for (const f of state.flags) {
      const sag = Math.sin((f.x / W) * Math.PI) * 3;
      const sway = Math.sin(t * 2 + f.phase) * 0.15;
      ctx.save();
      ctx.translate(f.x, flagY + sag);
      ctx.rotate(sway);
      ctx.fillStyle = f.color;
      ctx.strokeStyle = '#2a3a4d';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(-5, 0);
      ctx.lineTo(5, 0);
      ctx.lineTo(0, 10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // Top horizontal string the lanterns hang from
  ctx.save();
  ctx.strokeStyle = 'rgba(42,58,77,0.45)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, 14);
  for (let x = 0; x <= W; x += 12) {
    const sag = Math.sin((x / W) * Math.PI) * 4;
    ctx.lineTo(x, 14 + sag);
  }
  ctx.stroke();
  ctx.restore();

  for (const lan of state.lanterns) {
    const sway = Math.sin(t * 1.2 + lan.phase) * 4;
    const ang  = Math.sin(t * 1.2 + lan.phase) * 0.06;
    ctx.save();
    ctx.translate(lan.x + sway, lan.y);
    ctx.rotate(ang);

    // 🌟 warm glow halo behind the lantern
    const haloGrad = ctx.createRadialGradient(0, lan.size * 0.5, 0, 0, lan.size * 0.5, lan.size * 1.8);
    haloGrad.addColorStop(0, lan.color + '88');
    haloGrad.addColorStop(0.5, lan.color + '33');
    haloGrad.addColorStop(1, 'rgba(0,0,0,0)');
