    ctx.fillStyle = haloGrad;
    ctx.fillRect(-lan.size * 1.8, -lan.size * 1.3, lan.size * 3.6, lan.size * 3.2);

    // hanging string
    ctx.strokeStyle = '#2a3a4d';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -2);
    ctx.lineTo(0, -8);
    ctx.stroke();
    // top cap
    ctx.fillStyle = '#2a3a4d';
    ctx.fillRect(-lan.size * 0.32, -2, lan.size * 0.64, 2);
    // body
    ctx.fillStyle = lan.color;
    ctx.strokeStyle = '#2a3a4d';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.ellipse(0, lan.size * 0.5, lan.size * 0.55, lan.size * 0.62, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();
    // vertical ribbing lines
    ctx.strokeStyle = 'rgba(42,58,77,0.35)';
    ctx.lineWidth = 0.8;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(i * lan.size * 0.25, lan.size * 0.02);
      ctx.lineTo(i * lan.size * 0.25, lan.size * 0.98);
      ctx.stroke();
    }
    // bottom cap
    ctx.fillStyle = '#2a3a4d';
    ctx.fillRect(-lan.size * 0.32, lan.size * 1.0, lan.size * 0.64, 2);
    // tiny tassel
    ctx.beginPath();
    ctx.moveTo(0, lan.size * 1.05);
    ctx.lineTo(0, lan.size * 1.18);
    ctx.stroke();
    ctx.restore();
  }
}

function drawConfettiBg() {
  for (const c of state.confettiBg) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.globalAlpha = 0.85;
    if (c.shape === 0) {
      ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
    } else if (c.shape === 1) {
      ctx.beginPath();
      ctx.arc(0, 0, c.size / 2, 0, TAU);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(0, -c.size / 2);
      ctx.lineTo(c.size / 2, c.size / 2);
      ctx.lineTo(-c.size / 2, c.size / 2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

// ---------- ☁️ drifting clouds ----------
function initClouds() {
  state.clouds = [];
  const count = 3;
  for (let i = 0; i < count; i++) {
    state.clouds.push({
      x: (W / count) * i + rand(-30, 30),
      y: rand(45, 110),
      size: rand(26, 44),
      speed: rand(0.05, 0.12) * (Math.random() < 0.5 ? -1 : 1),
    });
  }
}

function updateClouds(dt) {
  for (const c of state.clouds) {
    c.x += c.speed * dt;
    if (c.speed > 0 && c.x > W + c.size * 2) c.x = -c.size * 2;
    else if (c.speed < 0 && c.x < -c.size * 2) c.x = W + c.size * 2;
  }
}

function drawClouds() {
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.strokeStyle = 'rgba(42,58,77,0.25)';
  ctx.lineWidth = 1.2;
  for (const c of state.clouds) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.size * 0.6, 0, TAU);
    ctx.arc(c.x + c.size * 0.55, c.y + 2, c.size * 0.5, 0, TAU);
    ctx.arc(c.x - c.size * 0.55, c.y + 2, c.size * 0.45, 0, TAU);
    ctx.arc(c.x + c.size * 0.25, c.y - c.size * 0.3, c.size * 0.42, 0, TAU);
    ctx.arc(c.x - c.size * 0.25, c.y - c.size * 0.25, c.size * 0.38, 0, TAU);
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

// ---------- 💨 cold steam wisps rising from the pile ----------
function drawColdSteam(g) {
  if (state.pileH < 30) return;
  if (state.phase === 'title' || state.phase === 'ready') return;
  const t = performance.now() / 1000;
  const cx = g.bowlCenterX;
  const r = state.pileR * g.scale;
  const top = g.bowlRimY - state.pileH * g.scale;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // 4 wisps drifting upward in slow sinusoidal patterns
  for (let i = 0; i < 4; i++) {
    const phase = t * 0.5 + i * 1.7;
    const baseX = cx + Math.sin(phase) * r * 0.5;
    for (let j = 0; j < 5; j++) {
      const lift = ((t * 0.4 + i * 0.3 + j * 0.2) % 1.0);
      const x = baseX + Math.sin(phase + lift * 5) * (r * 0.3) + Math.sin(t * 0.8 + i) * 4;
      const y = top - lift * 70 * g.scale + rand(-2, 2);
      const alpha = (1 - lift) * 0.32;
      const sz = 6 + lift * 14;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, sz);
      grad.addColorStop(0, `rgba(200,225,235,${alpha})`);
      grad.addColorStop(1, 'rgba(200,225,235,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(x - sz, y - sz, sz * 2, sz * 2);
    }
  }
  ctx.restore();
}

// ---------- 🎆 fireworks for new records ----------
function spawnFirework() {
  const fx = state.fireworks || (state.fireworks = []);
  fx.push({
    x: rand(W * 0.15, W * 0.85),
    y: rand(40, H * 0.4),
    age: 0,
    max: 50,
    color: ['#ff5e7a','#ffd84a','#6cba87','#4287d6','#f08a4b','#a06cd5'][Math.floor(Math.random() * 6)],
    pieces: 18 + Math.floor(Math.random() * 6),
  });
}
function updateFireworks(dt) {
  if (!state.fireworks) return;
  for (const fw of state.fireworks) fw.age += dt;
  state.fireworks = state.fireworks.filter(fw => fw.age < fw.max);
}
function drawFireworks() {
  if (!state.fireworks || !state.fireworks.length) return;
  for (const fw of state.fireworks) {
    const p = fw.age / fw.max;
    const easeOut = 1 - Math.pow(1 - p, 2);
    const radius = easeOut * 55;
    const alpha = (1 - p) * 0.95;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < fw.pieces; i++) {
      const a = (i / fw.pieces) * TAU;
      const x = fw.x + Math.cos(a) * radius;
      const y = fw.y + Math.sin(a) * radius + easeOut * 12; // slight gravity
      // sparkle core
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(x, y, 2.5 * (1 - p), 0, TAU);
      ctx.fill();
      // colored halo
      const g = ctx.createRadialGradient(x, y, 0, x, y, 5);
      g.addColorStop(0, fw.color + 'cc');
      g.addColorStop(1, fw.color + '00');
      ctx.fillStyle = g;
      ctx.fillRect(x - 6, y - 6, 12, 12);
    }
    ctx.restore();
  }
}

// ---------- ✨ pile sparkles ----------
// Random sparkles on the pile surface — the ice catching sunlight.
function spawnPileSparkle(g) {
  if (state.pileH < 6 || state.pileR < 6) return;
  const cx = g.bowlCenterX;
  const r = state.pileR * g.scale * 0.85;
  // pick a random point on the dome's silhouette
  const nx = rand(-0.85, 0.85);
  const domeH = state.pileH * g.scale;
  const px = cx + nx * r;
  const py = g.bowlRimY - domeH * Math.pow(Math.cos(nx * Math.PI / 2), 1.3) + rand(-2, 0);
  state.pileSparkles.push({
    x: px, y: py,
    size: rand(3.5, 7.5),         // bigger
    life: 0,
    max: rand(28, 50),            // longer-lived
    color: state.syrupCoating ? '#ffffff' : '#dceffa',
  });
  if (state.pileSparkles.length > 80) state.pileSparkles.shift();
}

function updatePileSparkles(dt) {
  for (const s of state.pileSparkles) s.life += dt;
  state.pileSparkles = state.pileSparkles.filter(s => s.life < s.max);
}

function drawPileSparkles() {
  for (const s of state.pileSparkles) {
    const p = s.life / s.max;
    const alpha = Math.sin(p * Math.PI) * 1.0;
    // soft halo first
    ctx.save();
    const halo = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 3);
    halo.addColorStop(0, `rgba(255,255,255,${alpha * 0.5})`);
    halo.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(s.x - s.size * 3, s.y - s.size * 3, s.size * 6, s.size * 6);
    ctx.restore();
    drawSparkleStar(s.x, s.y, s.size, s.color, alpha);
  }
}

// ---------- 🔥 combo system ----------
function drawComboBadge(g) {
  // small combo counter near top of the screen during eating
  if (state.phase !== 'eating' || state.comboCount < 2) return;
  const t = performance.now() / 1000;
  const pulse = 1 + Math.sin(t * 9) * 0.10;
  const bounce = Math.sin(t * 7) * 3;
  ctx.save();
  ctx.translate(W / 2, 32 + bounce);
  ctx.scale(pulse, pulse);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // tint stronger at higher combo
  const heat = clamp(state.comboCount / 15, 0, 1);
  const color = heat > 0.66 ? '#ff2a5a' : heat > 0.33 ? '#ff7e3a' : '#ff9d3d';
  // glow halo
  const haloGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 70);
  haloGrad.addColorStop(0, color + '55');
  haloGrad.addColorStop(1, color + '00');
  ctx.fillStyle = haloGrad;
  ctx.fillRect(-70, -40, 140, 80);
  // text shadow layers
  for (let i = 3; i >= 1; i--) {
    ctx.fillStyle = `${color}${Math.round(80 / i).toString(16).padStart(2,'0')}`;
    ctx.font = 'bold 28px "Yusei Magic", serif';
    ctx.fillText(`🔥 COMBO ×${state.comboCount}`, i * 1.2, i * 1.2);
  }
  ctx.font = 'bold 28px "Yusei Magic", serif';
  ctx.lineWidth = 7;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#fff';
  ctx.strokeText(`🔥 COMBO ×${state.comboCount}`, 0, 0);
  ctx.fillStyle = color;
  ctx.fillText(`🔥 COMBO ×${state.comboCount}`, 0, 0);
  ctx.restore();
}

function drawComboCelebrate(g) {
  if (state.comboCelebrateT <= 0) return;
  const total = 1.0;
  const p = 1 - (state.comboCelebrateT / total);
  const easeOut = 1 - Math.pow(1 - p, 3);
  const yOff = (1 - easeOut) * 60;
  const alpha = p < 0.2 ? p / 0.2 : (p > 0.75 ? (1 - p) / 0.25 : 1);
  const scale = 0.5 + easeOut * 0.9;
  const wobble = Math.sin(p * Math.PI * 4) * 0.04 * (1 - p);
  ctx.save();
  ctx.translate(W / 2, H * 0.42 - yOff);
  ctx.scale(scale + wobble, scale - wobble);
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // background burst circle
  const burstGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 130);
  burstGrad.addColorStop(0, 'rgba(255,255,200,0.7)');
  burstGrad.addColorStop(1, 'rgba(255,255,200,0)');
  ctx.fillStyle = burstGrad;
  ctx.fillRect(-130, -130, 260, 260);
  // text with rainbow shadow
  const txt = `COMBO ×${state.comboCelebrateN}!`;
  ctx.font = 'bold 64px "Yusei Magic", serif';
  for (let i = 5; i >= 1; i--) {
    const hue = (i * 60 + p * 200) % 360;
    ctx.fillStyle = `hsla(${hue},80%,65%,0.5)`;
    ctx.fillText(txt, i * 1.8, i * 1.8);
  }
  ctx.lineWidth = 12;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#fff';
  ctx.strokeText(txt, 0, 0);
  ctx.fillStyle = state.comboCelebrateN >= 15 ? '#ff2a5a'
                : state.comboCelebrateN >= 10 ? '#ff7e3a'
                                              : '#ffd84a';
  ctx.fillText(txt, 0, 0);
  ctx.restore();
}

// ---------- 💨 manga-style speed lines during fast cranking ----------
function drawSpeedLines(g) {
  if (state.phase !== 'playing') return;
  if (!state.isDragging) return;
  // gauge cranking intensity from how fast totalRad has accumulated recently
  // (we approximate via state.shakeT which gets boosted by cranks indirectly)
  // -- simpler: use the rotations count + animal excitement as a proxy
  const intensity = clamp(state.animalExcitement - 0.3, 0, 1);
  if (intensity < 0.05) return;
  const t = performance.now() / 1000;
  const px = g.handlePivotX;
  const py = g.handlePivotY;
  const baseR = 50 * g.scale;
  ctx.save();
  ctx.strokeStyle = `rgba(42,58,77,${0.35 + intensity * 0.45})`;
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  const lineCount = 8;
  for (let i = 0; i < lineCount; i++) {
    const ang = (i / lineCount) * TAU + state.handleAngle * 0.3 + t * 2;
    const inner = baseR + 8 + Math.sin(t * 12 + i) * 4;
    const outer = inner + 14 + intensity * 18;
    const ix = px + Math.cos(ang) * inner;
    const iy = py + Math.sin(ang) * inner;
    const ox = px + Math.cos(ang) * outer;
    const oy = py + Math.sin(ang) * outer;
    ctx.beginPath();
    ctx.moveTo(ix, iy);
    ctx.lineTo(ox, oy);
    ctx.stroke();
  }
  ctx.restore();
}

// ---------- 🎓 first-time handle hint ----------
function drawHandleHint(g) {
  if (state.phase !== 'ready') return;
  // Fade out after ~6s or once the player has nudged the handle
  if (state.readyHintT > 6) return;
  const t = performance.now() / 1000;
  const fade = state.readyHintT < 4 ? 1 : Math.max(0, 1 - (state.readyHintT - 4) / 2);
  // Arrow position: just to the upper-right of the handle pivot
  const px = g.handlePivotX + 24 * g.scale;
  const py = g.handlePivotY - 22 * g.scale;
  const wiggle = Math.sin(t * 2.4) * 3;
  ctx.save();
  ctx.globalAlpha = fade;
  // little call-out label
  ctx.translate(px + 40, py - 16 + wiggle);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 13px "DotGothic16", monospace';
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#fff';
  ctx.strokeText('ハンドルを', 0, -7);
  ctx.strokeText('グルグル！', 0, 8);
  ctx.fillStyle = '#2a3a4d';
  ctx.fillText('ハンドルを', 0, -7);
  ctx.fillText('グルグル！', 0, 8);
  ctx.restore();
  // curved arrow pointing toward the handle
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.strokeStyle = '#ff5e7a';
  ctx.fillStyle   = '#ff5e7a';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px + 36, py - 4 + wiggle);
  ctx.quadraticCurveTo(px + 18, py + 8 + wiggle, px - 2, py + 2 + wiggle);
  ctx.stroke();
  // arrowhead
  ctx.save();
  ctx.translate(px - 2, py + 2 + wiggle);
  ctx.rotate(Math.PI);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(8, -4);
  ctx.lineTo(8, 4);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.restore();
}

// ---------- background animals ----------
// Populate animal positions across the canvas width. Called on resize so the
// spacing always matches the available canvas size.
function initBgAnimals() {
  const types = ['penguin', 'shirokuma', 'chick', 'penguin', 'chick', 'shirokuma', 'penguin'];
  const count = 7;
  state.bgAnimals = [];
  for (let i = 0; i < count; i++) {
    const slotX = (W / count) * (i + 0.5) + rand(-18, 18);
    // Alternate layers so back/front are spatially mixed across the width.
    // 'front' = drawn AFTER the bowl (closer to camera, slightly bigger).
    // 'back'  = drawn BEFORE the bowl (peeks out from behind it).
    const layer = (i % 2 === 0) ? 'back' : 'front';
    state.bgAnimals.push({
      type: types[i % types.length],
      x: clamp(slotX, 20, W - 20),
      vx: (Math.random() < 0.5 ? -1 : 1) * rand(0.18, 0.55),
      size: rand(20, 32),
      hopT: rand(0.3, 2.0),     // seconds until next hop
      hopPhase: 0,              // 0 when grounded; 0+ during hop arc (0..1)
      bobPhase: rand(0, TAU),   // per-animal phase offset for idle bob
      groundOffset: rand(-3, 3),// slight Y variation so they don't all align
      hopHeightMul: rand(0.7, 1.4),
      layer,
    });
  }
}

function updateBgAnimals(dt) {
  if (!state.bgAnimals.length) return;

  // 🐧 React to the game's energy level — excitement is computed in loop()
  //    based on the current phase + cranking activity. 0 = calm, 1 = frenzy.
  const ex = state.animalExcitement;
  const isTitle = state.phase === 'title';
  // base speed grows with excitement; title still gets a small extra boost
  const speedMul = (isTitle ? 1.6 : 0.75) + ex * 1.2;
  // smaller value = more frequent hops. Range: 2.2s at calm → 0.3s at frenzy
  const hopFreq  = (1 - ex) * 1.9 + 0.3;
  // hop heights also grow with excitement
  const hopHeightBoost = 1 + ex * 0.6;

  // 🦘 Sync-jump event: when triggered (e.g. TIME UP), force every animal to
  //    leap simultaneously regardless of their hopT countdown
  if (state.syncJumpT > 0.55) {
    for (const a of state.bgAnimals) {
      if (a.hopPhase <= 0) {
        a.hopPhase = 0.0001;
        // override the per-animal multiplier to a DRAMATIC synchronized jump
        a.syncBoost = 3.0;
      }
    }
    // ensure we only trigger once per event
    state.syncJumpT = 0.55;
  }

  for (const a of state.bgAnimals) {
    // Hop progression: 0 → 1 over ~0.5s
    if (a.hopPhase > 0) {
      a.hopPhase += dt * 0.05;
      if (a.hopPhase >= 1) {
        a.hopPhase = 0;
        a.hopT = rand(hopFreq * 0.4, hopFreq * 1.4);
        a.syncBoost = undefined; // reset after one hop
      }
    } else {
      a.hopT -= dt / 60;
      if (a.hopT <= 0) {
        a.hopPhase = 0.0001;
      }
    }

    // Horizontal roaming
    a.x += a.vx * speedMul * dt;

    // Bounce / wrap at canvas edges. During title phase: bounce off (so they
    // dance in the visible area). During gameplay: wrap (they peek in & out).
    if (isTitle) {
      if (a.x < 25)        { a.x = 25;     a.vx =  Math.abs(a.vx); }
      else if (a.x > W-25) { a.x = W - 25; a.vx = -Math.abs(a.vx); }
    } else {
      if (a.x < -30)       a.x = W + 30;
      else if (a.x > W+30) a.x = -30;
    }

    // Store the height multiplier for draw to use
    a._effectiveHopH = hopHeightBoost * (a.syncBoost || 1);
  }
}

function drawBgAnimals(g, layer) {
  if (!state.bgAnimals.length) return;
  // Animals are ALWAYS present — they're the festival's life, scurrying around
  // through every phase. Called twice per frame: once with 'back' (before the
  // bowl) and once with 'front' (after the bowl) to create natural layering.

  const t = performance.now() / 1000;
  const groundY = g.bowlBottomY + 4 * g.scale;
  // Front animals get a slight size boost + a touch lower Y so they read as
  // "closer to camera" relative to the back-layer crowd.
  const layerScale = (layer === 'front') ? 1.18 : 1.0;
  const layerYAdd  = (layer === 'front') ? 6 * g.scale : 0;

  for (const a of state.bgAnimals) {
    if (a.layer !== layer) continue;

    let yOff = 0;
    if (a.hopPhase > 0) {
      // Parabolic hop arc: sin(π·p) peaks in the middle
      const hopBoost = a._effectiveHopH || 1;
      yOff = -Math.sin(a.hopPhase * Math.PI) * a.size * 0.6 * a.hopHeightMul * hopBoost;
    }
    const screenSize = a.size * g.scale * layerScale;
    if (screenSize < 6) continue; // too small to be worth drawing

    const screenY = groundY + layerYAdd + a.groundOffset * g.scale + yOff * g.scale;

    ctx.save();
    ctx.translate(a.x, screenY);
    // Face the direction of movement
    if (a.vx < 0) ctx.scale(-1, 1);
    const opts = { phase: a.bobPhase };
    if (a.type === 'penguin')        drawPenguin(0, 0, screenSize, t, opts);
    else if (a.type === 'shirokuma') drawShirokuma(0, 0, screenSize, t, opts);
    else if (a.type === 'chick')     drawChick(0, 0, screenSize, t, opts);
    ctx.restore();
  }
}

// ---------- opening title screen ----------
function drawTitleScreen(g) {
  if (state.phase !== 'title') return;
  const t = performance.now() / 1000;

  // Vignette-style veil that's slightly darker on edges
  const veil = ctx.createRadialGradient(W / 2, H * 0.4, 0, W / 2, H * 0.4, Math.max(W, H) * 0.7);
  veil.addColorStop(0, 'rgba(255, 248, 232, 0.18)');
  veil.addColorStop(1, 'rgba(60, 30, 60, 0.35)');
  ctx.fillStyle = veil;
  ctx.fillRect(0, 0, W, H);

  // ✨ Drifting sparkles around the title — DOUBLE the count + multi-color
  const sparkleColors = ['#ffd84a','#ff5e7a','#4287d6','#6cba87','#a06cd5','#f08a4b'];

  // 🎆 Big background bloom behind the title

  bloomGrad.addColorStop(1, 'rgba(255,220,140,0)');

  // Decorative banner pill behind the title — with bigger float + slight rotation
  ctx.save();

  const titleRot = Math.sin(t * 1.7) * 0.025;
  ctx.translate(W / 2, titleYBase);

  // Small festival tag above the title
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 14px "DotGothic16", monospace';
  ctx.lineWidth = 5;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#fff';
  ctx.strokeText('🎐 夏祭り限定スペシャル 🎐', 0, -64);
  ctx.fillStyle = '#2a3a4d';
  ctx.fillText('🎐 夏祭り限定スペシャル 🎐', 0, -64);

  // Main title "カキ氷" — bigger with rainbow shadow stack
  const titleHue = (t * 60) % 360;
  ctx.font = 'bold 52px "Yusei Magic", serif';
  // shadow stack
  for (let i = 4; i >= 1; i--) {
    ctx.fillStyle = `hsla(${(titleHue + i * 30) % 360}, 80%, 65%, 0.4)`;
    ctx.fillText('カキ氷', i * 2, -10 + i * 2);
  }
  ctx.lineWidth = 12;

  ctx.fillStyle = '#ff5e7a';
  ctx.fillText('カキ氷', 0, -10);

  // Second line "フェスティバル"
  ctx.font = 'bold 34px "Yusei Magic", serif';
  for (let i = 4; i >= 1; i--) {
    ctx.fillStyle = `hsla(${(titleHue + 180 + i * 30) % 360}, 80%, 65%, 0.4)`;
    ctx.fillText('フェスティバル', i * 1.5, 36 + i * 1.5);
  }
  ctx.lineWidth = 10;
  ctx.strokeStyle = '#fff';
  ctx.strokeText('フェスティバル', 0, 36);
  ctx.fillStyle = '#4287d6';
  ctx.fillText('フェスティバル', 0, 36);
  ctx.restore();

  // "クリックでスタート" CTA — bigger, with arrow wiggle and stronger pulse
  const pulse = 1 + Math.sin(t * 4.5) * 0.10;
  ctx.save();
  ctx.translate(W / 2, H * 0.50);
  ctx.scale(pulse, pulse);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Pill background with gradient
  const ctaW = 240, ctaH = 52;
  const grad = ctx.createLinearGradient(0, -ctaH / 2, 0, ctaH / 2);

  grad.addColorStop(1, '#ffce4a');
  ctx.fillStyle = grad;
  ctx.strokeStyle = '#2a3a4d';
  ctx.lineWidth = 3.5;

  ctx.fillText('もうすぐ はじまるよ ♪', W / 2, H * 0.58);

}

// ---------- main loop ----------
let lastTime = performance.now();
function loop() {
  const now = performance.now();
  let ms = now - lastTime;
  // ⏰ Brief slow-mo during the TIME UP flash for cinematic punch
  if (state.timeUpFlashT > 0.25) ms *= 0.45;
  let dt = ms / 16.6;
  if (dt > 3) dt = 3;
  lastTime = now;

  // Tick timer — reward モードではタイマー無効 (3-5 歳向け = 焦らせない)
  if (state.phase === 'playing' && state.mode !== 'reward') {
    state.timeLeft -= ms / 1000;
    // ⏰ During the last 5 seconds, accumulate a warning pulse used for screen shake
    if (state.timeLeft <= 5 && state.timeLeft > 0) {
      state.warningPulseT += ms / 1000;
    } else {
      state.warningPulseT = 0;
    }
    if (state.timeLeft <= 0) {
      state.timeLeft = 0;
      finishGame();
    }
  } else {
    state.warningPulseT = 0;
  }

  // 🎓 Tick the ready-phase hint timer (used to fade out the handle hint)
  if (state.phase === 'ready') state.readyHintT += ms / 1000;
  else state.readyHintT = 0;

  // 🐧 Drive animal excitement based on the current phase
  let targetExcitement = 0.15;
  if (state.phase === 'title') targetExcitement = 0.95;
  else if (state.phase === 'playing') {
    // ramp by how fast they're cranking + last-5s panic boost
    const rotRate = state.isDragging ? 0.6 : 0.25;
    const lastSecBoost = state.timeLeft <= 5 ? 0.35 : 0;
    targetExcitement = Math.min(1, rotRate + lastSecBoost);
  }
  else if (state.phase === 'finished') targetExcitement = 0.75;
  else if (state.phase === 'eating')   targetExcitement = 0.9;
  else if (state.phase === 'done')     targetExcitement = 0.85;
  state.animalExcitement += (targetExcitement - state.animalExcitement) * 0.05 * dt;

  // 🦘 Sync-jump countdown
  if (state.syncJumpT > 0) state.syncJumpT = Math.max(0, state.syncJumpT - ms / 1000);

  updateParticles(dt);
  updateCottonParticles(dt);  // M12.5: わたあめ綿粒
  updateBgAnimals(dt);
  updateClouds(dt);
  updateFestivalBits(dt);
  updatePileSparkles(dt);
  updateFireworks(dt);
  if (state.shakeT > 0) state.shakeT -= dt;
  if (state.timeUpFlashT > 0) state.timeUpFlashT = Math.max(0, state.timeUpFlashT - ms / 1000);
  if (state.recordFlashT > 0) state.recordFlashT = Math.max(0, state.recordFlashT - ms / 1000);

  // ✨ Spawn pile sparkles during playing/finished as the ice catches light
  if ((state.phase === 'playing' || state.phase === 'finished' || state.phase === 'eating')
      && state.pileH > 10 && Math.random() < 0.16 + clamp(state.pileH / 600, 0, 0.35)) {
    const g = geometry();
    spawnPileSparkle(g);
    // Sometimes spawn 2 at once for extra magic
    if (Math.random() < 0.4) spawnPileSparkle(g);
  }

  // 🔥 Combo decay — if the player stalls > 0.75s, the combo resets
  if (state.phase === 'eating' && state.comboCount > 0) {
    const sinceLast = (now - state.comboLastT) / 1000;
    if (sinceLast > 0.75) state.comboCount = 0;
  }
  if (state.comboCelebrateT > 0) state.comboCelebrateT = Math.max(0, state.comboCelebrateT - ms / 1000);

  // 🍴 Auto-transition: once syrup is fully poured, jump to eating mode
  if (state.phase === 'finished' && state.syrupCoating && state.syrupCoating.progress >= 1) {
    startEating();
  }
  // M7.3: reward モード reveal phase は タップ までずっと滞在。
  // 自動遷移は無し。 1.5 秒後 hint をタップ誘導に切替えて子供にも分かるように。
  if (state.phase === 'reveal') {
    state.revealT += ms / 1000;
    if (state.revealT > 1.5) {
      const hintEl = document.getElementById('hint');
      if (hintEl.textContent !== '👆 タップで すすむ ♪') {
        hintEl.textContent = '👆 タップで すすむ ♪';
      }
    }
  }

  // celebration timing — the big celebration only fires at the very end (done).
  if (state.celebrating) {
    state.celebrationT += ms / 1000;
  }
  // Scene transition (e.g. finished -> eating) timer
  if (state.transitionT > 0) {
    state.transitionT = Math.max(0, state.transitionT - ms / 1000);
  }

  drawScene();
  updateScoreUI();

  requestAnimationFrame(loop);
}

function finishGame() {
  state.phase = 'finished';
  state.isDragging = false;
  state.lastPointerAngle = null;
  canvas.classList.remove('dragging');
  const isReward = state.mode === 'reward';
  // M9.1 / M12.5: 「形タイプ」 を屋台ごとの入力から判定 (= 失敗形なし)
  if (state.activity === 'cottoncandy') {
    // わたあめ: ストローク総距離で size 別 (= たくさん撫でたら大きく)
    const s = state.cottonStrokeTotal;
    if      (s < 600)  state.pileShape = 'fluffy';
    else if (s < 1800) state.pileShape = 'mokomoko';
    else               state.pileShape = 'tsuntsun';
    // 吸収時に追加された bump を活かす、 不足分だけ補充
    if (!state.pileProfile) state.pileProfile = [];
    while (state.pileProfile.length < 8) {
      state.pileProfile.push({
        nx:    rand(-0.85, 0.85),
        depth: rand(0.02, 0.05),
        width: rand(0.10, 0.18),
      });
    }
  } else {
    // かき氷: ハンドル回転速度 cps から (実 user で 1.0-2.0 cps が「速く」)
    const elapsed = Math.max(0.5, (performance.now() - state.playingStartT) / 1000);
    const cps = state.rotations / elapsed;
    if      (cps < 0.55) state.pileShape = 'fluffy';
    else if (cps < 1.05) state.pileShape = 'mokomoko';
    else                 state.pileShape = 'tsuntsun';
    const profile = [];
    for (let i = 0; i < 8; i++) {
      profile.push({
        nx:    rand(-0.85, 0.85),
        depth: rand(0.02, 0.07),
        width: rand(0.10, 0.20),
      });
    }
    state.pileProfile = profile;
  }
  // Freeze the achieved height for scoring purposes
  state.frozenHeightCm = Math.round(state.pileH / 4);
  state.frozenPileH = state.pileH;
  state.frozenPileR = state.pileR;
  // 🏔️ Save the best HEIGHT — reward モードでは記録しない (3-5 歳向け = 競争なし)
  if (!isReward && state.frozenHeightCm > state.bestHeight) {
    state.bestHeight = state.frozenHeightCm;
    state.heightNewRecord = true;
    saveBestHeight(state.frozenHeightCm);
  }
  // enable syrup buttons
  ['btn-ichigo','btn-melon','btn-blue','btn-lemon'].forEach(id => {
    document.getElementById(id).disabled = false;
  });
  document.getElementById('hint').textContent = isReward
    ? '🎨 シロップを えらんでね ♪'
    : '⏰ TIME UP! お好みのシロップを選ぼう ♪';
  // reward モードはシロップ選択 banner と pill が同時に出るため small で重なり回避
  // 削り終了 SE: reward = 達成感メロディ、 challenge = タイマー切れの下降系
  if (isReward) sndFinish(); else sndTimeUp();
  celebrate(isReward ? '🎨 シロップを えらんでね' : '⏰ TIME UP!', { small: isReward });

  // ⏰ Big white flash + shockwave + slight slow-mo — reward モードでは控えめに
  if (!isReward) state.timeUpFlashT = 1.0;
  // 🦘 All animals leap together to celebrate the moment
  state.syncJumpT = 0.7;
  // Burst confetti from the top to commemorate (reward は控えめに半分)
  const burstCount = isReward ? 14 : 28;
  for (let i = 0; i < burstCount; i++) {
    state.confettiBg.push({
      x: rand(W * 0.2, W * 0.8),
      y: rand(-30, 0),
      vx: rand(-0.5, 0.5),
      vy: rand(0.5, 1.3),
      rot: rand(0, TAU),
      vrot: rand(-0.08, 0.08),
      color: ['#ff5e7a','#ffd84a','#6cba87','#4287d6','#f08a4b'][i % 5],
      size: rand(4, 7),
      shape: i % 3,
    });
  }

  updatePhaseUI();
  bounceControls();
}

function startCelebration() {
  state.celebrating = true;
  state.celebrationT = 0;

  // Position characters in canvas coords (they don't follow camera)
  // bowl center on canvas: W * 0.45, near bottom
  const bowlCX = W * 0.45;
  const ground = H - 56;        // feet rest at this y
  state.characters = [
    { type: 'penguin',   baseX: bowlCX - W * 0.32, baseY: ground,        entryT: 0.05, bobPhase: 0,   flip: false },
    { type: 'shirokuma', baseX: bowlCX + W * 0.32, baseY: ground,        entryT: 0.20, bobPhase: 1.7, flip: true  },
    { type: 'chick',     baseX: bowlCX + W * 0.22, baseY: H * 0.48,      entryT: 0.40, bobPhase: 3.0, flip: false },
  ];

  // Sparkles around the kakigori (in canvas coords too, so they stay framed)
  const g = geometry();
  const r  = state.pileR * g.scale;
  const h  = state.pileH * g.scale;
  const cx = g.bowlCenterX;
  const baseY = g.bowlRimY;
  state.sparkles = [];
  for (let i = 0; i < 14; i++) {
    const ang = (i / 14) * TAU - Math.PI / 2 + rand(-0.25, 0.25);
    const dist = Math.max(r, 30) * (1.25 + rand(0, 0.65));
    state.sparkles.push({
      x: cx + Math.cos(ang) * dist,
      y: (baseY - h * 0.55) + Math.sin(ang) * dist * 0.75,
      phase: rand(0, TAU),
      size: rand(3.5, 7.5),
      color: ['#ffd166','#fff6a8','#ffe28a'][Math.floor(Math.random()*3)],
    });
  }
}

function startGame() {
  state.phase = 'playing';
  state.timeLeft = GAME_DURATION;
  state.playingStartT = performance.now();  // M9.1: cps 計算用
  let hint;
  if (state.activity === 'cottoncandy')   hint = 'ゆびで わたを あつめてね ♪「できた！」 で かんせい';
  else if (state.mode === 'reward')        hint = 'すきなだけ まわしてね ♪「できた！」 ボタンで かんせい';
  else                                     hint = 'ぐるぐる回そう！！ ⟳';
  document.getElementById('hint').textContent = hint;
  updatePhaseUI();
}

function updateScoreUI() {
  // HEIGHT — current during play, frozen after timer ends
  let displayCm;
  if (state.phase === 'ready' || state.phase === 'playing') {
    displayCm = Math.round(state.pileH / 4);
  } else {
    displayCm = state.frozenHeightCm;
  }
  // Display in meters with 1 decimal place (e.g. 200cm → "2.0m")
  const displayM = (displayCm / 100).toFixed(1);
  document.getElementById('height').innerHTML = displayM + '<span class="unit">m</span>';

  // まわした slot — eating/done では「たべた / かけざん」 に切り替え
  const rotEl = document.getElementById('rotations');
  const rotLabel = document.querySelector('#rot-item .score-label');
  if (state.phase === 'eating') {
    rotLabel.textContent = 'たべた';
    rotEl.textContent = state.eatingClicks + '/' + state.eatingMaxClicks;
  } else if (state.phase === 'done') {
    rotLabel.textContent = '× かけざん';
    rotEl.innerHTML = state.finalMultiplier.toFixed(1) + '<span class="unit">×</span>';
  } else {
    rotLabel.textContent = 'まわした';
    rotEl.textContent = state.rotations;
  }

  // BEST — separate records for height (m) and score (pt)
  // bestHeight is stored as a cm value (legacy/internal); convert to m for display
  document.getElementById('best-height').textContent = (state.bestHeight / 100).toFixed(1);
  document.getElementById('best-score').textContent  = state.bestScore.toFixed(1);

  // 🎯 Best progress bars — visualize how close current is to personal best
  // Height bar: current pile (or frozen) / best height
  const curHeight = (state.phase === 'ready' || state.phase === 'playing')
    ? state.pileH / 4
    : state.frozenHeightCm;
  const heightBar = document.getElementById('best-height-bar');
  if (state.bestHeight > 0) {
    const ratio = curHeight / state.bestHeight;
    heightBar.style.width = Math.min(100, ratio * 100).toFixed(1) + '%';
    heightBar.classList.toggle('maxed', ratio >= 1);
  } else {
    heightBar.style.width = (curHeight > 0 ? '100' : '0') + '%';
    heightBar.classList.toggle('maxed', curHeight > 0);
  }
  // Score bar: only meaningful during/after eating
  const scoreBar = document.getElementById('best-score-bar');
  const curScore = (state.phase === 'done') ? state.finalScore
                : (state.phase === 'eating') ? curHeight * state.eatingLiveMult
                : 0;
  if (state.bestScore > 0) {
    const ratio = curScore / state.bestScore;
    scoreBar.style.width = Math.min(100, ratio * 100).toFixed(1) + '%';
    scoreBar.classList.toggle('maxed', ratio >= 1);
  } else {
    scoreBar.style.width = (curScore > 0 ? '100' : '0') + '%';
    scoreBar.classList.toggle('maxed', curScore > 0);
  }

  // TIME — countdown during play, elapsed during eat, final after done
  const timeEl = document.getElementById('time');
  const timeItem = document.getElementById('time-item');
  if (state.phase === 'eating' || state.phase === 'done') {
    timeEl.innerHTML = state.eatingElapsed.toFixed(1) + '<span class="unit">びょう</span>';
    timeItem.classList.remove('urgent');
    timeItem.classList.toggle('done', state.phase === 'done');
  } else {
    const secs = Math.ceil(state.timeLeft);
    timeEl.innerHTML = secs + '<span class="unit">びょう</span>';
    timeItem.classList.toggle('urgent', state.phase === 'playing' && secs <= 5);
    timeItem.classList.toggle('done',   state.phase === 'finished');
  }
}

function celebrate(msg, opts = {}) {
  const el = document.getElementById('celebrate');
  el.textContent = msg;
  el.classList.remove('show', 'small');
  if (opts.small) el.classList.add('small');
  void el.offsetWidth;
  el.classList.add('show');
}

// Apply a bouncy entrance animation to the controls pill — used whenever the
// pill becomes visible at a new phase, so the user can't miss what's there
function bounceControls() {
  const ctrls = document.getElementById('action-controls');
  ctrls.classList.remove('reveal');
  void ctrls.offsetWidth;
  ctrls.classList.add('reveal');
  setTimeout(() => ctrls.classList.remove('reveal'), 800);
}

// Show only the buttons that make sense for the current phase
function updatePhaseUI() {
  const phase = state.phase;
  const isReward = state.mode === 'reward';

  // mode-select overlay only visible during 'mode-select' phase
  document.getElementById('mode-select').classList.toggle('hidden', phase !== 'mode-select');

  // scoreboard は challenge モードの play / 結果フェーズだけ表示。
  // title / mode-select / reward モードでは隠して「ホーム感」 と 認知負荷を低減。
  const hideScoreboard = isReward || phase === 'title' || phase === 'mode-select';
  document.querySelector('.scoreboard').style.display = hideScoreboard ? 'none' : '';

  // 🏠 ホームボタンは title / mode-select 以外で常時表示 (= 全 phase から戻れる)
  const showHome = phase !== 'title' && phase !== 'mode-select';
  const showSyrup = phase === 'finished';
  const showReset = phase === 'done';
  const showDoneBtn = isReward && phase === 'playing';

  // Safety-net 階層: ホーム専用ゾーン (= 左下固定、 Primary と別 DOM)
  document.getElementById('safety-controls').classList.toggle('hidden', !showHome);

  // Share ゾーン: reveal phase だけ表示 (= 完成かき氷の「保存・シェア」 を促す)
  document.getElementById('share-controls').classList.toggle('hidden', phase !== 'reveal');

  // Primary 階層: action pill 内のボタンを phase で出し分け
  ['btn-ichigo','btn-melon','btn-blue','btn-lemon'].forEach(id => {
    document.getElementById(id).style.display = showSyrup ? '' : 'none';
  });
  const resetBtn = document.getElementById('btn-reset');
  resetBtn.style.display = showReset ? '' : 'none';
  resetBtn.classList.toggle('big', phase === 'done');

  const doneBtn = document.getElementById('btn-done');
  doneBtn.style.display = showDoneBtn ? '' : 'none';

  // action pill 自体は Primary が 1 個でもあれば visible (= showHome は除外)
  const actionVisible = showSyrup || showReset || showDoneBtn;
  const ctrls = document.getElementById('action-controls');
  ctrls.classList.toggle('hidden', !actionVisible);
  // challenge done のみ中央寄せ (= スコア結果が主役)。 reward done は下部固定で完成かき氷を邪魔しない (Codex 案 C)
  ctrls.classList.toggle('center', phase === 'done' && state.mode !== 'reward');
  // Canvas cursor: pointer during eating + title to invite clicks
  canvas.classList.toggle('eating', phase === 'eating' || phase === 'title');
}

// ---------- input ----------
function pointerDown(e) {
  // TITLE: tap → mode-select screen
  if (state.phase === 'title') {
    e.preventDefault();
    state.phase = 'mode-select';
    document.getElementById('hint').textContent = 'モードを えらんでね';
    updatePhaseUI();
    return;
  }
  // MODE-SELECT: ignore taps on the canvas — the player must use the buttons
  if (state.phase === 'mode-select') {
    e.preventDefault();
    return;
  }
  // REVEAL: 完成かき氷の展示画面、 tap で skip → done へ
  if (state.phase === 'reveal') {
    e.preventDefault();
    finishReveal();
    return;
  }
  // EATING: any canvas click = one bite
  if (state.phase === 'eating') {
    e.preventDefault();
    const pt = getPointer(e);
    eatBite(pt);
    return;
  }
  // FINISHED or DONE: no cranking allowed
  if (state.phase === 'finished' || state.phase === 'done') return;
  e.preventDefault();
  const pt = getPointer(e);

  // わたあめ: 画面どこ touch でも isDragging、 ハンドル grab 不要
  if (state.activity === 'cottoncandy') {
    state.isDragging = true;
    state.cottonLastPointer = pt;
    canvas.classList.add('dragging');
    return;
  }

  // かき氷: ハンドル近接で grab
  const g = geometry();
  const dx = pt.x - g.handlePivotX;
  const dy = pt.y - g.handlePivotY;
  const dist = Math.hypot(dx, dy);
  if (dist < g.armLen + 50) {
    state.isDragging = true;
    state.lastPointerAngle = Math.atan2(dy, dx);
    canvas.classList.add('dragging');
  }
}

// ---------- eating phase ----------
function startEating() {
  if (state.phase !== 'finished') return;
  if (!state.syrupCoating) return; // need syrup first

  // reward モードでは eating フェーズなし → シロップ完了でそのまま done へ
  if (state.mode === 'reward') {
    finishReward();
    return;
  }

  state.phase = 'eating';
  state.eatingClicks = 0;
  state.eatingStartT = 0;
  state.eatingElapsed = 0;
  state.eatingLiveMult = 1;
  // scale max-clicks to height (no upper cap — bigger piles = more clicks
  // = a genuine "I worked hard" achievement)
  state.eatingMaxClicks = Math.max(8, Math.round(state.frozenHeightCm / 4) + 6);
  state.targetPileH = state.pileH;
  state.targetPileR = state.pileR;

  // 🎬 Scene transition flash + big prompt
  state.transitionT = 1.6;

  // disable any remaining syrup buttons (they should already be disabled)
  ['btn-ichigo','btn-melon','btn-blue','btn-lemon'].forEach(id => {
    document.getElementById(id).disabled = true;
  });
  document.getElementById('hint').textContent =
    `🥄 連打して早食い勝負！ 残り ${state.eatingMaxClicks} 口！`;
  updatePhaseUI();
}

// reward モード専用: シロップ完了 → reveal phase (= 完成かき氷の展示) へ
// 2.5 秒後 or tap で finishReveal → done に進む (M7.2)
function finishReward() {
  state.phase = 'reveal';
  state.revealT = 0;
  // M9.1 + M12: 形タイプ + 屋台名で命名 (= 「ふわふわ かき氷」 「ふわふわ わたあめ」 等)
  const shapeName = getPileShape().name;
  state.praiseLabel = `${shapeName} ${getActivityName()}\nできたね！`;
  sndFinish();
  document.getElementById('hint').textContent = '✨ できあがり〜！';
  celebrate('🎉 できたね！');
  startCelebration();
  state.syncJumpT = 0.8;
  // 紙吹雪シャワー (= 展示の祝祭感)
  for (let i = 0; i < 36; i++) {
    state.confettiBg.push({
      x: rand(0, W),
      y: rand(-40, 0),
      vx: rand(-0.6, 0.6),
      vy: rand(0.5, 1.4),
      rot: rand(0, TAU),
      vrot: rand(-0.10, 0.10),
      color: ['#ff5e7a','#ffd84a','#6cba87','#4287d6','#f08a4b','#a06cd5'][i % 6],
      size: rand(4, 8),
      shape: i % 3,
    });
  }
  // 花火 3 連発
  spawnFirework();
  setTimeout(() => spawnFirework(), 350);
  setTimeout(() => spawnFirework(), 700);
  updatePhaseUI();
}

// reveal → done: 完成展示を抜けて 「もう1回」 ボタンを出す
function finishReveal() {
  state.phase = 'done';
  // M9.1 + M12: done でも形タイプ名 + 屋台名 を維持
  const shapeName = getPileShape().name;
  state.praiseLabel = `${shapeName} ${getActivityName()}\nおいしそう ✨`;
  document.getElementById('hint').textContent = '🎉 できた！ もう1回やる？';
  updatePhaseUI();
  bounceControls();
  // 「もう1回」 押下の誤射防止 (= 短め、 reveal で既に見せ時間を取ったため)
  const resetBtn = document.getElementById('btn-reset');
  resetBtn.disabled = true;
  resetBtn.classList.add('locked');
  setTimeout(() => {
    resetBtn.disabled = false;
    resetBtn.classList.remove('locked');
  }, 800);
}

function eatBite(pt) {
  if (state.eatingClicks >= state.eatingMaxClicks) return;

  sndChomp();

  // start timing on first bite
  if (state.eatingClicks === 0) state.eatingStartT = performance.now();

  state.eatingClicks++;
  state.eatingElapsed = (performance.now() - state.eatingStartT) / 1000;

  // 🔥 Combo tracking — bites within 0.55s of the previous one extend the combo
  const now = performance.now();
  if (state.comboLastT > 0 && (now - state.comboLastT) / 1000 < 0.55) {
    state.comboCount++;
  } else {
    state.comboCount = 1;
  }
  state.comboLastT = now;
  if (state.comboCount > state.comboBest) state.comboBest = state.comboCount;
  // Trigger big celebration text at meaningful milestones
  if (state.comboCount === 5 || state.comboCount === 10 || state.comboCount === 15 || state.comboCount === 20) {
    state.comboCelebrateT = 1.0;
    state.comboCelebrateN = state.comboCount;
  }

  // Live multiplier: clicks-per-second based
  const cps = state.eatingClicks / Math.max(0.2, state.eatingElapsed);
  state.eatingLiveMult = clamp(0.7 + cps * 0.3, 1.0, 5.0);

  // Shrink the pile toward the next target size (eased in update loop)
  const remaining = state.eatingMaxClicks - state.eatingClicks;
  const ratio = remaining / state.eatingMaxClicks;
  state.targetPileH = state.frozenPileH * ratio;
  state.targetPileR = state.frozenPileR * ratio;

  // Particle burst — chunks fly toward upper-right (mouth direction)
  spawnBiteParticles();

  // Chomp visual feedback (anchored to the multiplier badge in drawCelebration)
  const words = ['ガブッ！','ガリッ！','モグッ','パクッ','うまっ！'];
  state.chompFx.push({
    life: 0,
    word: words[Math.floor(Math.random() * words.length)],
  });
  if (state.chompFx.length > 5) state.chompFx.shift();

  // Wobble + multiplier badge pop
  state.shakeT = 6;
  state.multBadgePulse = 1.0;

  // Update remaining count in hint
  document.getElementById('hint').textContent =
    `🥄 のこり ${state.eatingMaxClicks - state.eatingClicks} 口！`;

  // 💥 FINAL BITE — extra explosion + flash + camera kick
  if (state.eatingClicks >= state.eatingMaxClicks) {
    // Trigger time-up-like flash for the climactic ending
    state.timeUpFlashT = 0.5;
    state.shakeT = 14;
    // Second wave of particles
    spawnBiteParticles();
    spawnBiteParticles();
    finishEating();
  }
}

function spawnBiteParticles() {
  const g = geometry();
  const cx = g.bowlCenterX;
  const baseY = g.bowlRimY;
  const h = state.pileH * g.scale;
  const r = state.pileR * g.scale;
  const top = baseY - h;
  const c  = state.syrupCoating ? state.syrupCoating.color     : '#dceffa';
  const cd = state.syrupCoating ? state.syrupCoating.darkColor : '#9bc4d4';

  // 💥 Big explosion: 28 chunks + 12 sparkles + 6 sweet drips
  for (let i = 0; i < 28; i++) {
    const ang = -Math.PI / 2 + rand(-1.2, 1.2);
    const speed = rand(4, 9);
    const isSyrup = Math.random() < 0.45;
    state.particles.push({
      x: cx + rand(-r * 0.45, r * 0.45),
      y: top + rand(-6, 8),
      vx: Math.cos(ang) * speed + rand(-0.8, 0.8),
      vy: Math.sin(ang) * speed - rand(0.8, 2.4),
      vrot: rand(-0.25, 0.25),
      rot: rand(0, TAU),
      size: isSyrup ? rand(3, 6) : rand(3, 6.5),
      tilt: rand(0.5, 1.0),
      life: 0,
      color: isSyrup ? c : null,
      stroke: isSyrup ? cd : null,
      isBite: true,
    });
  }
  // 12 white-hot sparkle particles for added pop
  for (let i = 0; i < 12; i++) {
    const ang = -Math.PI / 2 + rand(-1.5, 1.5);
    const speed = rand(5, 11);
    state.particles.push({
      x: cx + rand(-r * 0.4, r * 0.4),
      y: top + rand(-8, 4),
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed - rand(1.0, 2.5),
      vrot: rand(-0.4, 0.4),
      rot: rand(0, TAU),
      size: rand(1.5, 3.2),
      tilt: 1,
      life: 0,
      color: '#ffffff',
      stroke: '#ffe0ad',
      isBite: true,
      isSpark: true,
    });
  }
  // Camera kick on every bite
  state.shakeT = Math.max(state.shakeT, 9);
}

function finishEating() {
  state.phase = 'done';
  state.eatingElapsed = (performance.now() - state.eatingStartT) / 1000;
  // Final multiplier
  const cps = state.eatingMaxClicks / Math.max(0.4, state.eatingElapsed);
  state.finalMultiplier = clamp(0.7 + cps * 0.3, 1.0, 5.0);

  // 🔥 Combo bonus: best combo this run translates to a small extra (up to ×1.2)
  const comboBonus = 1 + Math.min(0.2, state.comboBest * 0.012);

  // Final score = height_cm × multiplier × combo
  state.finalScore = Math.round(
    state.frozenHeightCm * state.finalMultiplier * comboBonus * 10
  ) / 10;

  // ★ Save the best SCORE achievement (independent of height)
  if (state.finalScore > state.bestScore) {
    state.bestScore = state.finalScore;
    saveBestScore(state.finalScore);
    state.scoreNewRecord = true;
  }

  // Final praise label combining everything
  const t = state.eatingElapsed;
  const speedLabel =
        t < 1.5 ? '⚡ 神速！'
      : t < 2.5 ? '🔥 爆食い！'
      : t < 4.0 ? '✨ 早食い！'
      : t < 7.0 ? '👍 いいペース'
      :           '😋 完食';

  // Determine record prefix: W new record / height only / score only / none
  let recordPrefix = '';
  if (state.heightNewRecord && state.scoreNewRecord) recordPrefix = '🎉 W新記録！ ';
  else if (state.heightNewRecord)                    recordPrefix = '🏔️ 高さ新記録！ ';
  else if (state.scoreNewRecord)                     recordPrefix = '★ スコア新記録！ ';

  const headline = recordPrefix + speedLabel;
  const heightM  = (state.frozenHeightCm / 100).toFixed(2);
  let subline = `${heightM}m × ${state.finalMultiplier.toFixed(1)}倍`;
  if (state.comboBest >= 5)     subline += ` × 🔥${comboBonus.toFixed(2)}`;
  subline += ` = ${state.finalScore}てん`;
  state.praiseLabel = headline + '\n' + subline;

  // 新記録なら ファンファーレ、 そうでなければ達成感メロディ
  if (state.heightNewRecord || state.scoreNewRecord) sndNewRecord();
  else sndFinish();
  document.getElementById('hint').textContent = '🎉 完食！ もう1回？ → 🔄 もう1回！';
  celebrate('🎉 ごちそうさま！');
  // 🎉 The big celebration only fires at the END (after eating)
  startCelebration();
  // 🦘 Animals all leap at completion
  state.syncJumpT = 0.8;
  // 🎊 New record extra fanfare — fireworks, confetti rain, double cheer
  if (state.heightNewRecord || state.scoreNewRecord) {
    // schedule a 2nd & 3rd sync-jump for a "triple cheer"
    setTimeout(() => { state.syncJumpT = 0.7; }, 500);
    setTimeout(() => { state.syncJumpT = 0.7; }, 1000);
    // burst extra background confetti (heavy)
    for (let i = 0; i < 60; i++) {
      state.confettiBg.push({
        x: rand(0, W),
        y: rand(-40, 0),
        vx: rand(-0.8, 0.8),
        vy: rand(0.6, 1.8),
        rot: rand(0, TAU),
        vrot: rand(-0.12, 0.12),
        color: ['#ff5e7a','#ffd84a','#6cba87','#4287d6','#f08a4b','#a06cd5'][i % 6],
        size: rand(5, 10),
        shape: i % 3,
      });
    }
    // 🎆 Salvo of fireworks across the sky
    spawnFirework();
    setTimeout(() => spawnFirework(), 200);
    setTimeout(() => spawnFirework(), 450);
    setTimeout(() => spawnFirework(), 700);
    setTimeout(() => spawnFirework(), 950);
    setTimeout(() => spawnFirework(), 1200);
    // 🌈 Trigger a full-screen rainbow flash via state flag
    state.recordFlashT = 0.9;
    // ✨ Flash the BEST scoreboard card
    const bestCard = document.querySelector('.score-item.best');
    if (bestCard) {
      bestCard.classList.remove('recording');
      void bestCard.offsetWidth;
      bestCard.classList.add('recording');
      setTimeout(() => bestCard.classList.remove('recording'), 2600);
    }
  }
  updatePhaseUI();
  bounceControls();

  // 🛡️ Lockout: prevent the rapid-clicking momentum from accidentally hitting
  // the freshly-revealed "もう1回！" button. Disable it for 1.2s — long enough
  // for the user to register that the game has ended and re-target.
  const resetBtn = document.getElementById('btn-reset');
  resetBtn.disabled = true;
  resetBtn.classList.add('locked');
  setTimeout(() => {
    resetBtn.disabled = false;
    resetBtn.classList.remove('locked');
  }, 1200);
}


function pointerMove(e) {
  if (!state.isDragging) return;
  e.preventDefault();
  const pt = getPointer(e);

  // わたあめ: 粒を指方向に引く + stroke 集計
  if (state.activity === 'cottoncandy') {
    for (const p of state.cottonParticles) {
      const dx = pt.x - p.x;
      const dy = pt.y - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 60) {
        const force = 0.20 * (1 - dist / 60);
        p.vx += (dx / Math.max(1, dist)) * force;
        p.vy += (dy / Math.max(1, dist)) * force;
        const sp = Math.hypot(p.vx, p.vy);
        if (sp > 3.5) { p.vx = p.vx / sp * 3.5; p.vy = p.vy / sp * 3.5; }
      }
    }
    if (state.cottonLastPointer) {
      const sdx = pt.x - state.cottonLastPointer.x;
      const sdy = pt.y - state.cottonLastPointer.y;
      state.cottonStrokeTotal += Math.hypot(sdx, sdy);
    }
    state.cottonLastPointer = pt;
    if (state.phase === 'ready') startGame();
    sndSlice();  // なでる感の SE (= 既存 80ms throttle)
    return;
  }

  const g = geometry();
  const a = Math.atan2(pt.y - g.handlePivotY, pt.x - g.handlePivotX);
  let delta = a - state.lastPointerAngle;
  // wrap
  if (delta > Math.PI) delta -= TAU;
  if (delta < -Math.PI) delta += TAU;

  // ignore tiny/huge spurious deltas
  if (Math.abs(delta) > Math.PI * 0.8) {
    state.lastPointerAngle = a;
    return;
  }
  if (Math.abs(delta) < 0.001) return;

  state.handleAngle += delta;
  state.totalRad += Math.abs(delta);
  state.lastPointerAngle = a;

  // first meaningful crank kicks off the 30s countdown
  if (state.phase === 'ready') startGame();

  const newRotations = Math.floor(state.totalRad / TAU);
  if (newRotations !== state.rotations) {
    const rotDiff = newRotations - state.rotations;
    state.rotations = newRotations;
    // 🎁 Rotation bonus: reward actual cranking over fast mouse wiggling
    state.shavings += 15 * rotDiff;
    updatePile();
    // Flash ROTATIONS scoreboard cell + a quick bonus FX near the machine
    const rotItem = document.getElementById('rot-item');
    rotItem.classList.remove('flash');
    void rotItem.offsetWidth;
    rotItem.classList.add('flash');
    spawnRotationBonusFx();
    sndRotationBonus();
  }

  // spawn shavings proportional to rotation distance (slightly reduced so
  // rotation bonuses feel more impactful relative to wiggle-spam)
  const amount = Math.min(10, Math.max(1, Math.round(Math.abs(delta) * 11)));
  spawnShavings(amount, a);
  sndSlice();  // 80ms throttle で短い「シャリッ」 SE
}

function pointerUp(e) {
  state.isDragging = false;
  state.lastPointerAngle = null;
  canvas.classList.remove('dragging');
}

canvas.addEventListener('mousedown', pointerDown);
window.addEventListener('mousemove', pointerMove);
window.addEventListener('mouseup', pointerUp);

canvas.addEventListener('touchstart', pointerDown, { passive: false });
window.addEventListener('touchmove', pointerMove, { passive: false });
window.addEventListener('touchend', pointerUp);
window.addEventListener('touchcancel', pointerUp);

// ---------- mode select ----------
// M12.0: 屋台を切り替える (= ハイブリッド型ホームメニューの上段操作)
function selectStall(activity) {
  if (activity === state.activity) return;
  sndButton();
  state.activity = activity;
  document.querySelectorAll('.ms-stall').forEach(el => el.classList.remove('selected'));
  const btn = document.getElementById(`btn-stall-${activity}`);
  if (btn) btn.classList.add('selected');
  // 屋台ごとに利用可能モードが違う: わたあめは のんびり 限定
  updateModeAvailability();
}

// 屋台に応じてモードボタンの enable/disable を更新
function updateModeAvailability() {
  const challengeBtn = document.getElementById('btn-mode-challenge');
  if (state.activity === 'cottoncandy') {
    challengeBtn.disabled = true;
    challengeBtn.classList.add('locked');
  } else {
    challengeBtn.disabled = false;
    challengeBtn.classList.remove('locked');
  }
}

function selectMode(mode) {
  sndButton();
  // わたあめは のんびり (= reward) 限定
  if (state.activity === 'cottoncandy' && mode === 'challenge') return;
  state.mode = mode;
  state.phase = 'ready';
  document.getElementById('hint').textContent = state.activity === 'cottoncandy'
    ? 'ゆびで わたを あつめよう ☁️'
    : 'ハンドルを グルグル まわそう！⟳';
  updatePhaseUI();
}
document.getElementById('btn-mode-reward').addEventListener('click', () => selectMode('reward'));
document.getElementById('btn-mode-challenge').addEventListener('click', () => selectMode('challenge'));

// 屋台タイル: click で activity 切替
document.getElementById('btn-stall-kakigori').addEventListener('click', () => selectStall('kakigori'));
document.getElementById('btn-stall-cottoncandy').addEventListener('click', () => selectStall('cottoncandy'));
// 初期 challenge ボタン状態 (= 起動時 activity='kakigori' なので OK だが念のため)
updateModeAvailability();

// reward モード: 「できた！」 ボタンで finished フェーズへ (= タイマー切れの代わり)
document.getElementById('btn-done').addEventListener('click', () => {
  if (state.phase !== 'playing') return;
  if (state.mode !== 'reward') return;
  finishGame();
});

// 🏠 ホーム: どの phase からでも mode-select に戻る (= state.mode と進行を完全破棄)
function goHome() {
  sndHome();
  resetGame();
  state.mode = null;
  state.phase = 'mode-select';
  document.getElementById('hint').textContent = 'モードを えらんでね';
  updatePhaseUI();
}
document.getElementById('btn-home').addEventListener('click', goHome);

// 📷 完成かき氷を画像保存 / シェア (= M8.0)
// Web Share API 対応端末 (iOS/Android 大半 + 一部 desktop) では navigator.share、
// 非対応 (= 旧 PC ブラウザ等) では PNG download にフォールバック。
async function shareKakigori(ev) {
  if (ev) ev.stopPropagation();
  sndButton();
  const canvas = document.getElementById('game');
  const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
  if (!blob) return;
  const fname = `kakigori-${Date.now()}.png`;
  const file = new File([blob], fname, { type: 'image/png' });
  // Web Share API: file 添付シェアが使えるか試す
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({
        files: [file],
        title: 'できたよ！ 🍧',
        text: '夏祭り かき氷フェスティバル でできたよ',
        url: 'https://mm-1989.github.io/natsu-matsuri-game/',
      });
      return;
    } catch (_) {
      // user キャンセル等は無視して download fallback
    }
  }
  // Fallback: ローカル download
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
document.getElementById('btn-share').addEventListener('click', shareKakigori);

// ---------- syrup ----------

// helper: 2 色の hex を t (0-1) で線形補間 (= わたあめ着色用 / M12.1)
function mixColorHex(c1, c2, t) {
  const parse = (hex) => {
    const h = hex.replace('#','');
    return h.length === 3
      ? [parseInt(h[0]+h[0],16), parseInt(h[1]+h[1],16), parseInt(h[2]+h[2],16)]
      : [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  };
  const [r1,g1,b1] = parse(c1);
  const [r2,g2,b2] = parse(c2);
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const b = Math.round(b1 + (b2 - b1) * t);
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

// helper: shift a hex color toward white or black for highlights/shadows
function shadeHex(hex, amt) {
  const h = hex.replace('#','');
  const num = parseInt(h.length === 3
    ? h.split('').map(c => c + c).join('')
    : h, 16);
  let r = (num >> 16) & 0xff;
  let gr = (num >> 8) & 0xff;
  let b = num & 0xff;
  if (amt > 0) {
    r  = Math.round(r  + (255 - r)  * amt);
    gr = Math.round(gr + (255 - gr) * amt);
    b  = Math.round(b  + (255 - b)  * amt);
  } else {
    const a = 1 + amt;
    r  = Math.round(r  * a);
    gr = Math.round(gr * a);
    b  = Math.round(b  * a);
  }
  return '#' + [r, gr, b].map(v => v.toString(16).padStart(2,'0')).join('');
}

function pourSyrup(color) {
  if (state.phase !== 'finished') return;
  if (state.syrupCoating) return; // already poured

  // Generate organic features that combine into one continuous silhouette.
  const features = [];

  const numDrips = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < numDrips; i++) {
    features.push({
      nx:    rand(-0.82, 0.82),
      depth: rand(0.42, 0.85),
      width: rand(0.12, 0.24),
      power: rand(0.6, 1.4),
      skew:  rand(-0.35, 0.35),
      delay: rand(0, 0.30),
    });
  }

  const numBumps = 5 + Math.floor(Math.random() * 4);
  for (let i = 0; i < numBumps; i++) {
    features.push({
      nx:    rand(-0.95, 0.95),
      depth: rand(0.05, 0.22),
      width: rand(0.18, 0.36),
      power: rand(1.0, 2.2),
      skew:  rand(-0.3, 0.3),
      delay: rand(0, 0.20),
    });
  }

  state.syrupCoating = {
    color,
    lightColor: shadeHex(color, 0.40),
    darkColor:  shadeHex(color, -0.22),
    features,
    noiseSeed: Math.random() * 1000,
    progress: 0,
    durationFrames: 55,
  };

  state.syrupDrops = [];

  const map = {
    '#e94560': 'btn-ichigo',
    '#6cba87': 'btn-melon',
    '#4287d6': 'btn-blue',
    '#f2c94c': 'btn-lemon',
  };
  ['btn-ichigo','btn-melon','btn-blue','btn-lemon'].forEach(id => {
    document.getElementById(id).classList.remove('selected');
  });
  if (map[color]) document.getElementById(map[color]).classList.add('selected');

  sndSyrup();
  celebrate('🍧 シロップ完了！');
  document.getElementById('hint').textContent = '🍧 美味しそう…！';

  // 🔒 Commit — disable ALL syrup buttons (no re-pour, no layering)
  ['btn-ichigo','btn-melon','btn-blue','btn-lemon'].forEach(id => {
    document.getElementById(id).disabled = true;
  });
}

function resetGame() {
  state.shavings = 0;
  state.rotations = 0;
  state.totalRad = 0;
  state.pileH = 0;
  state.pileR = 0;
  state.particles = [];
  state.syrupDrops = [];
  state.syrupCoating = null;
  state.fluff = [];
  state.handleAngle = 0;
  state.newRecord = false;
  state.heightNewRecord = false;
  state.scoreNewRecord = false;
  state.phase = 'ready';
  state.timeLeft = GAME_DURATION;
  // eating reset
  state.eatingClicks = 0;
  state.eatingStartT = 0;
  state.eatingElapsed = 0;
  state.eatingLiveMult = 1;
  state.frozenHeightCm = 0;
  state.frozenPileH = 0;
  state.frozenPileR = 0;
  state.targetPileH = 0;
  state.targetPileR = 0;
  state.finalMultiplier = 1;
  state.finalScore = 0;
  state.multBadgePulse = 0;
  state.chompFx = [];
  state.rotationFx = [];
  state.transitionT = 0;
  // celebration cleanup (zoom will animate back to 1)
  state.celebrating = false;
  state.celebrationT = 0;
  state.characters = [];
  state.sparkles = [];
  state.praiseLabel = '';
  state.revealT = 0;
  // M9.1: 形タイプ + でこぼこ + cps timer をリセット
  state.pileShape = 'mokomoko';
  state.pileProfile = null;
  state.playingStartT = 0;
  // M12.5: わたあめ綿粒系もリセット
  state.cottonParticles = [];
  state.cottonSpawnT = 0;
  state.cottonStrokeTotal = 0;
  state.cottonLastPointer = null;
  state.cottonBalance = 0;
  // 🆕 reset all brushup state
  state.pileSparkles = [];
  state.timeUpFlashT = 0;
  state.warningPulseT = 0;
  state.comboCount = 0;
  state.comboLastT = 0;
  state.comboBest = 0;
  state.comboCelebrateT = 0;
  state.readyHintT = 0;
  state.syncJumpT = 0;
  state.fireworks = [];
  state.recordFlashT = 0;
  // disable + deselect syrup buttons
  ['btn-ichigo','btn-melon','btn-blue','btn-lemon'].forEach(id => {
    const el = document.getElementById(id);
    el.disabled = true;
    el.classList.remove('selected');
  });
  // finishReward が触った resetBtn の inline style を清掃 (= 次プレイへ持ち越さない)
  const resetBtn = document.getElementById('btn-reset');
  resetBtn.style.opacity = '';
  resetBtn.style.pointerEvents = '';
  resetBtn.style.transition = '';
  let resetHint;
  if (state.activity === 'cottoncandy')   resetHint = 'ゆびで わたを あつめてね ♪';
  else if (state.mode === 'reward')        resetHint = 'すきなだけ まわしてね ♪';
  else                                     resetHint = 'ハンドルを回すと 30 秒のタイマー開始！';
  document.getElementById('hint').textContent = resetHint;
  updatePhaseUI();
}

// ---------- init ----------
window.addEventListener('resize', resize);
resize();
updatePhaseUI();
requestAnimationFrame(loop);

// title 画面はスプラッシュ扱い: 1.8 秒で自動的に mode-select へ
// (= 「もどる」 経路がない title 画面で迷子になるのを防ぐ。
//  早く始めたい user は title 中の canvas タップで即 mode-select へ skip 可)
setTimeout(() => {
  if (state.phase === 'title') {
    state.phase = 'mode-select';
    document.getElementById('hint').textContent = 'モードを えらんでね';
    updatePhaseUI();
  }
}, 1800);

// PWA: service worker 登録 — オフライン動作 + ホームに追加 で使う
// localhost ではスコープ干渉に注意 (= 他プロジェクトと同じ origin の場合)、
// GitHub Pages では /natsu-matsuri-game/ 配下に scope 限定。
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.warn('SW registration failed:', err);
    });
  });
}
